<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>民政数据资源目录 · 交互原型</title>

<!--
  ============================================================================
  设计假定与推理（按 baoyu-design 流程第 3 步：先讲清假设，再动手）
  ----------------------------------------------------------------------------
  使用场景：省级民政部门数据管理员的日常工作台。每天要查目录、看字段、
           发起共享申请、跟踪审核。是「工具」不是「门户」，信息密度优先。

  视觉方向（明确规避 AI slop 套路）：
    · 不用任何渐变背景；不用 emoji；不用「圆角卡片 + 左侧色条」式导航
    · 不堆四张 hero 大数字卡片（data slop）——目录数量放工具条一行小字
    · 字重/字号/留白建立层级，而不是靠色块堆叠
    · 状态用小圆点 + 文字，不做 pill 丛
    · 字体不引入 Inter/Roboto/Arial 等被滥用的 webfont，走系统中文字体栈

  色彩：中性 ink/slate 灰阶 + 单一靛青 accent，全部用 oklch 定义，
        保证同色相不同明度之间感知均匀。语义色低饱和，只标识状态不抢视线。

  交互（interactive-prototype）：即时搜索、共享类型分段筛选、列排序、
        行选中 → 右侧详情抽屉、共享申请（含校验）→ 确认弹窗 → 我的申请落库、
        浅色/深色主题切换（令牌翻转，非 anywhere 三元）。

  交付形态说明：baoyu-design 默认「多文件 + HTTP 服务」预览。因本产物要经微信
        发给用户在他自己机器上打开，故同时产出单文件 standalone 版本
        （React/Babel 走 skill 指定的 pinned CDN + integrity）。
  ============================================================================
-->

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
/* ===== 令牌 ===== */
:root{
  --bg:            oklch(98.2% 0.003 255);
  --surface:       oklch(100% 0 0);
  --surface-2:     oklch(97.2% 0.004 255);
  --surface-3:     oklch(94.8% 0.005 255);
  --border:        oklch(91.5% 0.006 255);
  --border-strong: oklch(85% 0.008 255);
  --text:          oklch(23% 0.018 262);
  --text-2:        oklch(46% 0.014 262);
  --text-3:        oklch(63% 0.010 262);
  --accent:        oklch(48% 0.09 245);
  --accent-hi:     oklch(42% 0.10 245);
  --accent-soft:   oklch(95.5% 0.018 245);
  /* 聚焦环：用实心浅色调而非带 alpha 的 oklch —— 非浏览器渲染器（WeasyPrint）
     在 box-shadow 的渐变路径上无法转换 oklch+alpha，会直接抛 NotImplementedError。
     实心浅色在视觉上等价，且保留 oklch 的同色相和谐。 */
  --accent-ring:   oklch(88% 0.045 245);
  --ok:            oklch(52% 0.085 158);
  --ok-soft:       oklch(95.5% 0.025 158);
  --warn:          oklch(58% 0.10 72);
  --warn-soft:     oklch(96% 0.030 80);
  --danger:        oklch(53% 0.145 26);
  --danger-soft:   oklch(96% 0.028 26);
  /* 阴影用 rgba（纯黑透明度，非品牌色），同样规避上述渲染器限制 */
  --shadow-1: 0 1px 2px rgb(15 23 42 / .06);
  --shadow-2: 0 6px 24px rgb(15 23 42 / .10), 0 1px 3px rgb(15 23 42 / .06);
  --r: 6px;
  --r-lg: 10px;
  --font: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei",
          system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"]{
  --bg:            oklch(19.5% 0.012 262);
  --surface:       oklch(23.5% 0.014 262);
  --surface-2:     oklch(26.5% 0.014 262);
  --surface-3:     oklch(30% 0.015 262);
  --border:        oklch(32% 0.014 262);
  --border-strong: oklch(40% 0.016 262);
  --text:          oklch(94% 0.008 262);
  --text-2:        oklch(76% 0.012 262);
  --text-3:        oklch(60% 0.012 262);
  --accent:        oklch(72% 0.10 245);
  --accent-hi:     oklch(80% 0.10 245);
  --accent-soft:   oklch(31% 0.045 245);
  --accent-ring:   oklch(38% 0.05 245);
  --ok:            oklch(74% 0.10 158);
  --ok-soft:       oklch(30% 0.045 158);
  --warn:          oklch(80% 0.11 78);
  --warn-soft:     oklch(31% 0.045 78);
  --danger:        oklch(72% 0.14 26);
  --danger-soft:   oklch(31% 0.05 26);
  --shadow-1: 0 1px 2px rgb(0 0 0 / .35);
  --shadow-2: 0 8px 28px rgb(0 0 0 / .45), 0 1px 3px rgb(0 0 0 / .35);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg); color:var(--text);
  font-size:13.5px; line-height:1.72;              /* CJK 行高加大 */
  text-wrap:pretty;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 外壳 ===== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
}

/* ===== 侧栏 ===== */
.side{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:9px}
.brand .mark{
  width:24px;height:24px;flex:0 0 24px;border-radius:5px;
  background:var(--text); color:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;letter-spacing:.5px;
}
.brand .name{font-size:13.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--text-3);margin-top:-4px}
.nav{padding:4px 10px 10px;overflow-y:auto;flex:1;min-height:0}
.nav .grp{
  font-size:11px;color:var(--text-3);letter-spacing:.6px;
  padding:14px 8px 5px;
}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;border-radius:var(--r);font-size:13px;color:var(--text-2);
  transition:background .12s,color .12s;
}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{
  background:var(--accent-soft); color:var(--accent); font-weight:650;
}
.nav button svg{flex:0 0 16px;opacity:.85}
.nav .badge{
  margin-left:auto;font-size:11px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}
.side-foot{
  border-top:1px solid var(--border);padding:10px 16px;
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);
}
.who{width:22px;height:22px;border-radius:50%;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-2)}

/* ===== 主区 ===== */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{
  display:flex;align-items:center;gap:14px;
  padding:16px 24px 12px;border-bottom:1px solid var(--border);
  background:var(--surface);
}
.head h1{font-size:15px;font-weight:650;letter-spacing:.1px}
.head .path{font-size:12px;color:var(--text-3);margin-top:1px}
.head .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{
  width:30px;height:30px;border-radius:var(--r);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;transition:background .12s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

.body{padding:18px 24px 28px;overflow-y:auto;min-height:0}

/* ===== 工具条 ===== */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;
}
.search{
  position:relative;flex:1 1 260px;max-width:340px;
}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none}
.search input{
  width:100%;height:32px;padding:0 10px 0 30px;
  border:1px solid var(--border-strong);border-radius:var(--r);
  background:var(--surface);font-size:13px;
  transition:border-color .12s,box-shadow .12s;
}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);outline:none}

.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--r);
  background:var(--surface);overflow:hidden}
.seg button{
  padding:0 11px;height:30px;font-size:12.5px;color:var(--text-2);
  transition:background .12s,color .12s;white-space:nowrap;
}
.seg button + button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);font-weight:650}

.btn{
  height:32px;padding:0 13px;border-radius:var(--r);font-size:13px;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:oklch(99% 0 0)}
.btn-primary:hover{background:var(--accent-hi)}
.btn-ghost{border:1px solid var(--border-strong);color:var(--text-2);background:var(--surface)}
.btn-ghost:hover{border-color:var(--border-strong);background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{margin-left:auto}
.count{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ===== 表格 ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-1)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{
  position:sticky;top:0;z-index:1;
  background:var(--surface-2);text-align:left;font-weight:550;
  font-size:12px;color:var(--text-2);letter-spacing:.2px;
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--text)}
thead th .arrow{font-size:10px;color:var(--accent);margin-left:3px}
tbody td{
  padding:10px 12px;border-bottom:1px solid var(--border);
  vertical-align:middle;font-size:13px;
}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
tbody tr{cursor:pointer}
td.name{font-weight:550;letter-spacing:.1px}
td.org{color:var(--text-2);font-size:12.5px}
td.dim{color:var(--text-2);font-variant-numeric:tabular-nums}
td.time{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12.5px}

/* 状态：小圆点 + 文字，不做 pill 丛 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;flex:0 0 6px;display:block}
.st-pub i{background:var(--ok)}      .st-pub{color:var(--text-2)}
.st-rev i{background:var(--warn)}    .st-rev{color:var(--text-2)}
.st-off i{background:var(--text-3)}  .st-off{color:var(--text-3)}
.share{font-size:12.5px;color:var(--text-2)}
.share-free{color:var(--ok)}
.share-cond{color:var(--warn)}
.share-none{color:var(--text-3)}

.empty{padding:44px 20px;text-align:center;color:var(--text-3);font-size:13px}
.pager{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-top:1px solid var(--border);background:var(--surface);
}
.pager .pg{
  min-width:28px;height:26px;padding:0 7px;border-radius:5px;
  border:1px solid var(--border);font-size:12.5px;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.pager .pg:hover{border-color:var(--border-strong);color:var(--text)}
.pager .pg[aria-current="true"]{background:var(--accent);border-color:var(--accent);
  color:oklch(99% 0 0);font-weight:650}

/* ===== 抽屉 ===== */
/* 注意：写 inset:0 / min(a,b) 这类简写会让非浏览器渲染器（WeasyPrint）解析失败 →
   阴影层尺寸塌陷、抽屉宽度失效。统一用显式的四边定位 + 固定宽度 + max-width。 */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgb(15 23 42 / .34);
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:40}
.scrim[data-open="true"]{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:520px;max-width:94vw;
  background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow-2);z-index:50;
  transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer[data-open="true"]{transform:none}
.drawer header{
  padding:15px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:12px;
}
.drawer header h2{font-size:14.5px;font-weight:650;line-height:1.5}
.drawer header .code{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:2px}
.drawer .close{margin-left:auto;flex:0 0 auto}
.dbody{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
.dfoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

.tabs{display:flex;gap:16px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{
  padding:7px 0;font-size:13px;color:var(--text-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .12s,border-color .12s;
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}

/* 定义列表（详情用，比卡片墙更省视线） */
.dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:0;
  border-top:1px solid var(--border)}
.dl dt{
  padding:9px 10px 9px 0;font-size:12.5px;color:var(--text-3);
  border-bottom:1px solid var(--border);
}
.dl dd{
  padding:9px 0;font-size:13px;border-bottom:1px solid var(--border);
  min-width:0;overflow-wrap:anywhere;
}
.dl dd.note{color:var(--text-2);line-height:1.75}

/* ===== 表单 ===== */
.field{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;
  align-items:start;margin-bottom:15px}
.field > label{font-size:12.5px;color:var(--text-2);padding-top:7px}
.field .req{color:var(--danger);margin-right:2px}
.field .ctl{min-width:0}
.inp,.sel,.ta{
  width:100%;border:1px solid var(--border-strong);border-radius:var(--r);
  background:var(--surface);padding:6px 10px;font-size:13px;
  transition:border-color .12s,box-shadow .12s;
}
.inp,.sel{height:32px}
.ta{min-height:84px;resize:vertical;line-height:1.7}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-ring);outline:none}
.inp[readonly]{background:var(--surface-2);color:var(--text-2)}
.help{font-size:11.5px;color:var(--text-3);margin-top:5px;line-height:1.6}
.help.err{color:var(--danger)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
  color:var(--text-2);line-height:1.7;cursor:pointer}
.check input{
  appearance:none;-webkit-appearance:none;
  width:15px;height:15px;flex:0 0 15px;margin-top:3px;
  border:1px solid var(--border-strong);border-radius:3px;background:var(--surface);
  position:relative;cursor:pointer;transition:background .12s,border-color .12s;
}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;
  border:solid oklch(99% 0 0);border-width:0 2px 2px 0;transform:rotate(45deg);
}
.steps{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);
  margin-bottom:18px;flex-wrap:wrap}
.steps .s{display:inline-flex;align-items:center;gap:6px}
.steps .d{width:18px;height:18px;border-radius:50%;background:var(--surface-3);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-variant-numeric:tabular-nums}
.steps .s[data-on="true"]{color:var(--accent)}
.steps .s[data-on="true"] .d{background:var(--accent);color:oklch(99% 0 0)}
.steps .bar{width:28px;height:1px;background:var(--border-strong)}

/* ===== 弹窗 / 提示 ===== */
.modal{
  position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.97);
  width:396px;max-width:92vw;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);z-index:60;opacity:0;visibility:hidden;
  transition:.16s;border:1px solid var(--border);
}
.modal[data-open="true"]{opacity:1;visibility:visible;
  transform:translate(-50%,-50%) scale(1)}
.modal h3{padding:16px 18px 6px;font-size:14px;font-weight:650}
.modal .mbody{padding:0 18px;font-size:13px;color:var(--text-2);line-height:1.75}
.modal .mfoot{padding:16px 18px;display:flex;gap:8px;justify-content:flex-end}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-size:12.5px;z-index:70;transition:transform .22s;box-shadow:var(--shadow-2);
  max-width:88vw;text-align:center;
}
.toast[data-open="true"]{transform:translate(-50%,0)}

/* 分节标题 */
.sect{font-size:12px;color:var(--text-3);letter-spacing:.4px;margin:2px 0 10px}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:1px}
.kpi .k{font-size:11.5px;color:var(--text-3)}
.kpi .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
</style>
</head>
<body>
<div id="root"></div>

<!-- 依赖顺序：数据 → 图标 → 呈现组件 → 应用入口（最后） -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
