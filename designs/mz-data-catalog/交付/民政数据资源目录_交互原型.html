<title>民政数据资源目录 · 交互原型</title>

<!--
  ============================================================================
  设计假定与推理（按 baoyu-design 流程第 3 步：先讲清假设，再动手）
  ----------------------------------------------------------------------------
  使用场景：省级民政部门数据管理员的日常工作台。每天要查目录、看字段、
           发起共享申请、跟踪审核。是「工具」不是「门户」，信息密度优先。

  视觉方向（明确规避 AI slop 套路）：
    · 不用任何渐变背景；不用 emoji；不用「圆角卡片 + 左侧色条」式导航
    · 不堆四张 hero 大数字卡片（data slop）——目录数量放工具条一行小字
    · 字重/字号/留白建立层级，而不是靠色块堆叠
    · 状态用小圆点 + 文字，不做 pill 丛
    · 字体不引入 Inter/Roboto/Arial 等被滥用的 webfont，走系统中文字体栈

  色彩：中性 ink/slate 灰阶 + 单一靛青 accent，全部用 oklch 定义，
        保证同色相不同明度之间感知均匀。语义色低饱和，只标识状态不抢视线。

  交互（interactive-prototype）：即时搜索、共享类型分段筛选、列排序、
        行选中 → 右侧详情抽屉、共享申请（含校验）→ 确认弹窗 → 我的申请落库、
        浅色/深色主题切换（令牌翻转，非 anywhere 三元）。

  交付形态说明：baoyu-design 默认「多文件 + HTTP 服务」预览。因本产物要经微信
        发给用户在他自己机器上打开，故同时产出单文件 standalone 版本
        （React/Babel 走 skill 指定的 pinned CDN + integrity）。
  ============================================================================
-->

<style>
/* ===== 令牌 ===== */
:root{
  --bg:            oklch(98.2% 0.003 255);
  --surface:       oklch(100% 0 0);
  --surface-2:     oklch(97.2% 0.004 255);
  --surface-3:     oklch(94.8% 0.005 255);
  --border:        oklch(91.5% 0.006 255);
  --border-strong: oklch(85% 0.008 255);
  --text:          oklch(23% 0.018 262);
  --text-2:        oklch(46% 0.014 262);
  --text-3:        oklch(63% 0.010 262);
  --accent:        oklch(48% 0.09 245);
  --accent-hi:     oklch(42% 0.10 245);
  --accent-soft:   oklch(95.5% 0.018 245);
  /* 聚焦环：用实心浅色调而非带 alpha 的 oklch —— 非浏览器渲染器（WeasyPrint）
     在 box-shadow 的渐变路径上无法转换 oklch+alpha，会直接抛 NotImplementedError。
     实心浅色在视觉上等价，且保留 oklch 的同色相和谐。 */
  --accent-ring:   oklch(88% 0.045 245);
  --ok:            oklch(52% 0.085 158);
  --ok-soft:       oklch(95.5% 0.025 158);
  --warn:          oklch(58% 0.10 72);
  --warn-soft:     oklch(96% 0.030 80);
  --danger:        oklch(53% 0.145 26);
  --danger-soft:   oklch(96% 0.028 26);
  /* 阴影用 rgba（纯黑透明度，非品牌色），同样规避上述渲染器限制 */
  --shadow-1: 0 1px 2px rgb(15 23 42 / .06);
  --shadow-2: 0 6px 24px rgb(15 23 42 / .10), 0 1px 3px rgb(15 23 42 / .06);
  --r: 6px;
  --r-lg: 10px;
  --font: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei",
          system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"]{
  --bg:            oklch(19.5% 0.012 262);
  --surface:       oklch(23.5% 0.014 262);
  --surface-2:     oklch(26.5% 0.014 262);
  --surface-3:     oklch(30% 0.015 262);
  --border:        oklch(32% 0.014 262);
  --border-strong: oklch(40% 0.016 262);
  --text:          oklch(94% 0.008 262);
  --text-2:        oklch(76% 0.012 262);
  --text-3:        oklch(60% 0.012 262);
  --accent:        oklch(72% 0.10 245);
  --accent-hi:     oklch(80% 0.10 245);
  --accent-soft:   oklch(31% 0.045 245);
  --accent-ring:   oklch(38% 0.05 245);
  --ok:            oklch(74% 0.10 158);
  --ok-soft:       oklch(30% 0.045 158);
  --warn:          oklch(80% 0.11 78);
  --warn-soft:     oklch(31% 0.045 78);
  --danger:        oklch(72% 0.14 26);
  --danger-soft:   oklch(31% 0.05 26);
  --shadow-1: 0 1px 2px rgb(0 0 0 / .35);
  --shadow-2: 0 8px 28px rgb(0 0 0 / .45), 0 1px 3px rgb(0 0 0 / .35);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg); color:var(--text);
  font-size:13.5px; line-height:1.72;              /* CJK 行高加大 */
  text-wrap:pretty;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== 外壳 ===== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
}

/* ===== 侧栏 ===== */
.side{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:9px}
.brand .mark{
  width:24px;height:24px;flex:0 0 24px;border-radius:5px;
  background:var(--text); color:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;letter-spacing:.5px;
}
.brand .name{font-size:13.5px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--text-3);margin-top:-4px}
.nav{padding:4px 10px 10px;overflow-y:auto;flex:1;min-height:0}
.nav .grp{
  font-size:11px;color:var(--text-3);letter-spacing:.6px;
  padding:14px 8px 5px;
}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;border-radius:var(--r);font-size:13px;color:var(--text-2);
  transition:background .12s,color .12s;
}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{
  background:var(--accent-soft); color:var(--accent); font-weight:650;
}
.nav button svg{flex:0 0 16px;opacity:.85}
.nav .badge{
  margin-left:auto;font-size:11px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}
.side-foot{
  border-top:1px solid var(--border);padding:10px 16px;
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);
}
.who{width:22px;height:22px;border-radius:50%;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-2)}

/* ===== 主区 ===== */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{
  display:flex;align-items:center;gap:14px;
  padding:16px 24px 12px;border-bottom:1px solid var(--border);
  background:var(--surface);
}
.head h1{font-size:15px;font-weight:650;letter-spacing:.1px}
.head .path{font-size:12px;color:var(--text-3);margin-top:1px}
.head .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{
  width:30px;height:30px;border-radius:var(--r);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;transition:background .12s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

.body{padding:18px 24px 28px;overflow-y:auto;min-height:0}

/* ===== 工具条 ===== */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;
}
.search{
  position:relative;flex:1 1 260px;max-width:340px;
}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none}
.search input{
  width:100%;height:32px;padding:0 10px 0 30px;
  border:1px solid var(--border-strong);border-radius:var(--r);
  background:var(--surface);font-size:13px;
  transition:border-color .12s,box-shadow .12s;
}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);outline:none}

.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--r);
  background:var(--surface);overflow:hidden}
.seg button{
  padding:0 11px;height:30px;font-size:12.5px;color:var(--text-2);
  transition:background .12s,color .12s;white-space:nowrap;
}
.seg button + button{border-left:1px solid var(--border)}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);font-weight:650}

.btn{
  height:32px;padding:0 13px;border-radius:var(--r);font-size:13px;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:oklch(99% 0 0)}
.btn-primary:hover{background:var(--accent-hi)}
.btn-ghost{border:1px solid var(--border-strong);color:var(--text-2);background:var(--surface)}
.btn-ghost:hover{border-color:var(--border-strong);background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{margin-left:auto}
.count{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ===== 表格 ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow-1)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{
  position:sticky;top:0;z-index:1;
  background:var(--surface-2);text-align:left;font-weight:550;
  font-size:12px;color:var(--text-2);letter-spacing:.2px;
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--text)}
thead th .arrow{font-size:10px;color:var(--accent);margin-left:3px}
tbody td{
  padding:10px 12px;border-bottom:1px solid var(--border);
  vertical-align:middle;font-size:13px;
}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
tbody tr{cursor:pointer}
td.name{font-weight:550;letter-spacing:.1px}
td.org{color:var(--text-2);font-size:12.5px}
td.dim{color:var(--text-2);font-variant-numeric:tabular-nums}
td.time{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12.5px}

/* 状态：小圆点 + 文字，不做 pill 丛 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;flex:0 0 6px;display:block}
.st-pub i{background:var(--ok)}      .st-pub{color:var(--text-2)}
.st-rev i{background:var(--warn)}    .st-rev{color:var(--text-2)}
.st-off i{background:var(--text-3)}  .st-off{color:var(--text-3)}
.share{font-size:12.5px;color:var(--text-2)}
.share-free{color:var(--ok)}
.share-cond{color:var(--warn)}
.share-none{color:var(--text-3)}

.empty{padding:44px 20px;text-align:center;color:var(--text-3);font-size:13px}
.pager{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-top:1px solid var(--border);background:var(--surface);
}
.pager .pg{
  min-width:28px;height:26px;padding:0 7px;border-radius:5px;
  border:1px solid var(--border);font-size:12.5px;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.pager .pg:hover{border-color:var(--border-strong);color:var(--text)}
.pager .pg[aria-current="true"]{background:var(--accent);border-color:var(--accent);
  color:oklch(99% 0 0);font-weight:650}

/* ===== 抽屉 ===== */
/* 注意：写 inset:0 / min(a,b) 这类简写会让非浏览器渲染器（WeasyPrint）解析失败 →
   阴影层尺寸塌陷、抽屉宽度失效。统一用显式的四边定位 + 固定宽度 + max-width。 */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgb(15 23 42 / .34);
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:40}
.scrim[data-open="true"]{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:520px;max-width:94vw;
  background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow-2);z-index:50;
  transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer[data-open="true"]{transform:none}
.drawer header{
  padding:15px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:12px;
}
.drawer header h2{font-size:14.5px;font-weight:650;line-height:1.5}
.drawer header .code{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:2px}
.drawer .close{margin-left:auto;flex:0 0 auto}
.dbody{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
.dfoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

.tabs{display:flex;gap:16px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{
  padding:7px 0;font-size:13px;color:var(--text-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .12s,border-color .12s;
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}

/* 定义列表（详情用，比卡片墙更省视线） */
.dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:0;
  border-top:1px solid var(--border)}
.dl dt{
  padding:9px 10px 9px 0;font-size:12.5px;color:var(--text-3);
  border-bottom:1px solid var(--border);
}
.dl dd{
  padding:9px 0;font-size:13px;border-bottom:1px solid var(--border);
  min-width:0;overflow-wrap:anywhere;
}
.dl dd.note{color:var(--text-2);line-height:1.75}

/* ===== 表单 ===== */
.field{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;
  align-items:start;margin-bottom:15px}
.field > label{font-size:12.5px;color:var(--text-2);padding-top:7px}
.field .req{color:var(--danger);margin-right:2px}
.field .ctl{min-width:0}
.inp,.sel,.ta{
  width:100%;border:1px solid var(--border-strong);border-radius:var(--r);
  background:var(--surface);padding:6px 10px;font-size:13px;
  transition:border-color .12s,box-shadow .12s;
}
.inp,.sel{height:32px}
.ta{min-height:84px;resize:vertical;line-height:1.7}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-ring);outline:none}
.inp[readonly]{background:var(--surface-2);color:var(--text-2)}
.help{font-size:11.5px;color:var(--text-3);margin-top:5px;line-height:1.6}
.help.err{color:var(--danger)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
  color:var(--text-2);line-height:1.7;cursor:pointer}
.check input{
  appearance:none;-webkit-appearance:none;
  width:15px;height:15px;flex:0 0 15px;margin-top:3px;
  border:1px solid var(--border-strong);border-radius:3px;background:var(--surface);
  position:relative;cursor:pointer;transition:background .12s,border-color .12s;
}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;
  border:solid oklch(99% 0 0);border-width:0 2px 2px 0;transform:rotate(45deg);
}
.steps{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);
  margin-bottom:18px;flex-wrap:wrap}
.steps .s{display:inline-flex;align-items:center;gap:6px}
.steps .d{width:18px;height:18px;border-radius:50%;background:var(--surface-3);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-variant-numeric:tabular-nums}
.steps .s[data-on="true"]{color:var(--accent)}
.steps .s[data-on="true"] .d{background:var(--accent);color:oklch(99% 0 0)}
.steps .bar{width:28px;height:1px;background:var(--border-strong)}

/* ===== 弹窗 / 提示 ===== */
.modal{
  position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.97);
  width:396px;max-width:92vw;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-2);z-index:60;opacity:0;visibility:hidden;
  transition:.16s;border:1px solid var(--border);
}
.modal[data-open="true"]{opacity:1;visibility:visible;
  transform:translate(-50%,-50%) scale(1)}
.modal h3{padding:16px 18px 6px;font-size:14px;font-weight:650}
.modal .mbody{padding:0 18px;font-size:13px;color:var(--text-2);line-height:1.75}
.modal .mfoot{padding:16px 18px;display:flex;gap:8px;justify-content:flex-end}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-size:12.5px;z-index:70;transition:transform .22s;box-shadow:var(--shadow-2);
  max-width:88vw;text-align:center;
}
.toast[data-open="true"]{transform:translate(-50%,0)}

/* 分节标题 */
.sect{font-size:12px;color:var(--text-3);letter-spacing:.4px;margin:2px 0 10px}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:1px}
.kpi .k{font-size:11.5px;color:var(--text-3)}
.kpi .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
</style>

          <div key={g.grp}>
            <div className="grp">{g.grp}</div>
            {g.items.map(it => {
              const I = window[it.icon];
              const badge = it.id === 'myapply' ? myCount : it.badge;
              return (
                <button key={it.id} type="button"
                        aria-current={screen === it.id ? 'page' : undefined}
                        id={`nav-${it.id}`}
                        onClick={() => onGo(it.id)}>
                  <I />
                  <span>{it.label}</span>

/* ---------- 分段控件 ---------- */

  return (
    <div className="seg" role="group" aria-label={label}>

        <button key={o} type="button"

    </div>
  );
}

/* ---------- 状态 / 共享类型 ---------- */
const Status = ({ value }) => (
  <span className={statusClass(value)}><i />{value}</span>
);
const Share = ({ value }) => (
  <span className={shareClass(value)}>{value}</span>
);

/* ---------- 目录表 ---------- */
const COLS = [
  { key:'name',    label:'目录名称',   cls:'name', sortable:true,  width:'auto' },
  { key:'org',     label:'提供单位',   cls:'org',  sortable:true,  width:'178px' },
  { key:'share',   label:'共享类型',   cls:'',     sortable:false, width:'96px' },
  { key:'size',    label:'数据量',     cls:'dim',  sortable:true,  width:'92px' },
  { key:'updated', label:'更新时间',   cls:'time', sortable:true,  width:'100px' },
  { key:'status',  label:'状态',       cls:'',     sortable:false, width:'84px' },
];

function CatalogTable({ rows, sort, onSort, selectedId, onOpen }){
  return (
    <div className="scroll">
      <table>
        <thead>
          <tr>
            {COLS.map(c => (
              <th key={c.key} style={{ width:c.width }}
                  className={c.sortable ? 'sortable' : ''}
                  scope="col"
                  onClick={c.sortable ? () => onSort(c.key) : undefined}>
                {c.label}
                {c.sortable && sort.key === c.key
                  ? <span className="arrow">{sort.dir === 'asc' ? '↑' : '↓'}</span>
                  : null}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.id} data-id={r.id}
                aria-selected={selectedId === r.id}
                onClick={() => onOpen(r.id)}>
              <td className={COLS[0].cls}>{r.name}</td>
              <td className={COLS[1].cls}>{r.org}</td>
              <td><Share value={r.share} /></td>
              <td className={COLS[3].cls}>{sizeText(r.size)}</td>
              <td className={COLS[4].cls}>{r.updated}</td>
              <td><Status value={r.status} /></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ---------- 分页 ---------- */
function Pager({ page, pages, total, onPage }){
  const nums = [];
  for (let p = 1; p <= pages; p++){
    if (pages > 7 && p > 2 && p < pages - 1 && Math.abs(p - page) > 1){
      if (nums[nums.length - 1] !== '…') nums.push('…');
      continue;
    }
    nums.push(p);
  }
  return (
    <div className="pager">
      <span className="count">共 {fmtNum(total)} 条</span>
      <span className="spacer" />
      <button className="pg" id="pg-prev" disabled={page <= 1}
              onClick={() => onPage(page - 1)}>上一页</button>
      {/* 注意：不能用 <span style={{display:'contents'}}> 包裹页码 —— 非浏览器渲染器
          不支持 display:contents，会导致这些按钮不再是 flex item 而错位换行。用 Fragment。 */}
      {nums.map((n, i) => n === '…'
        ? <span key={'d' + i} style={{ color:'var(--text-3)', padding:'0 2px' }}>…</span>
        : <button key={n} className="pg" data-page={n}
                  aria-current={n === page}
                  onClick={() => onPage(n)}>{n}</button>)}
      <button className="pg" id="pg-next" disabled={page >= pages}
              onClick={() => onPage(page + 1)}>下一页</button>
    </div>
  );
}

    <>
      <div className="scrim" data-open={open} onClick={onCancel} />
      <div className="modal" data-open={open} role="dialog" aria-modal="true"
           aria-labelledby="modal-title" data-screen-label="提交确认">
        <h3 id="modal-title">确认提交申请</h3>
        <div className="mbody" id="modal-body">{text}</div>
        <div className="mfoot">
          <button className="btn btn-ghost" id="btn-modal-cancel" onClick={onCancel}>再改改</button>
          <button className="btn btn-primary" id="btn-modal-ok" onClick={onOk}>确认提交</button>
        </div>
      </div>
    </>
  );
}

/* ---------- 提示条 ---------- */
const Toast = ({ msg, open }) => (
  <div className="toast" data-open={open} role="status" aria-live="polite">{msg}</div>
);

Object.assign(window, {
  NAV, Sidebar, Segmented, Status, Share, CatalogTable, Pager,
  DetailDrawer, ConfirmModal, Toast,
});

</script>
<!-- 内联自 app.jsx -->
<script type="text/babel" data-source="app.jsx">
/* app.jsx — App：状态所有者 + 挂载
   共享状态一律上提到 App，通过 props 下传（不跨文件散落 useState） */

const { useState, useEffect, useMemo, useRef } = React;
const { CATALOG, MY_APPLIES, CYCLE_OPTIONS, SHARE_FILTERS, sizeText, nowStamp } = window;

const PAGE_SIZE = 8;

function App(){
  /* ---- 主题（令牌翻转）---- */
  const [theme, setTheme] = useState('light');
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  /* ---- 导航 / 目录 ---- */
  const [screen, setScreen] = useState('catalog');
  const [records, setRecords] = useState(CATALOG);
  const [kw, setKw] = useState('');
  const [share, setShare] = useState('全部');
  const [sort, setSort] = useState({ key:'updated', dir:'desc' });
  const [page, setPage] = useState(1);

  /* ---- 详情抽屉 ---- */
  const [openId, setOpenId] = useState(null);
  const [drawerTab, setDrawerTab] = useState('base');
  const openRecord = records.find(r => r.id === openId) || null;

  /* ---- 申请表单 ---- */
  const [form, setForm] = useState({
    catalog:'', org:'省民政厅信息中心', type:'有条件共享', term:'1 年', usage:'', pledge:false,
  });
  const [errs, setErrs] = useState({});
  const [confirmOpen, setConfirmOpen] = useState(false);

  /* ---- 我的申请 / 提示 ---- */
  const [applies, setApplies] = useState(MY_APPLIES);
  const [toast, setToast] = useState({ open:false, msg:'' });
  const toastTimer = useRef(null);

  function say(msg){
    setToast({ open:true, msg });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(t => ({ ...t, open:false })), 2400);
  }

  /* ---- ESC 关闭浮层 ---- */
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape'){ setConfirmOpen(false); setOpenId(null); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  /* ---- 过滤 + 排序 ---- */
  const filtered = useMemo(() => {
    const q = kw.trim().toLowerCase();
    let rows = records.filter(r =>
      (!q || (r.name + r.org).toLowerCase().includes(q)) &&
      (share === '全部' || r.share === share)
    );
    const { key, dir } = sort;
    rows = rows.slice().sort((a, b) => {
      let x = a[key], y = b[key];
      if (typeof x === 'string'){ x = x.localeCompare(y, 'zh'); y = 0; }
      const d = typeof x === 'number' ? x - y : x;
      return dir === 'asc' ? d : -d;
    });
    return rows;
  }, [records, kw, share, sort]);

  const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const cur = Math.min(page, pages);
  const pageRows = filtered.slice((cur - 1) * PAGE_SIZE, cur * PAGE_SIZE);

  function changeSort(key){
    setSort(s => s.key === key
      ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' }
      : { key, dir: key === 'name' || key === 'org' ? 'asc' : 'desc' });
  }
  function goScreen(id){
    setScreen(id);
    if (id !== 'catalog') setOpenId(null);
    window.scrollTo(0, 0);
  }
  function openRecordById(id){
    setOpenId(id);
    setDrawerTab('base');
  }

  /* ---- 申请流程 ---- */
  function startApply(){
    const rec = openRecord;
    if (rec){
      setForm(f => ({
        ...f,
        catalog: rec.name,
        type: rec.share === '无条件共享' ? '无条件共享' : '有条件共享',
      }));
    }
    setErrs({});
    setOpenId(null);
    goScreen('apply');
  }
  function validate(){
    const e = {};
    if (!form.usage.trim()) e.usage = '请填写申请用途';
    else if (form.usage.trim().length < 10) e.usage = `申请用途不少于 10 字，当前 ${form.usage.trim().length} 字`;
    if (!form.pledge) e.pledge = '请勾选数据安全承诺';
    return e;
  }
  function submitApply(ev){
    ev.preventDefault();
    const e = validate();
    setErrs(e);
    if (Object.keys(e).length){ say(Object.values(e)[0]); return; }
    setConfirmOpen(true);
  }
  function confirmApply(){
    const no = 'SQ' + (1003 + applies.length - MY_APPLIES.length);
    setApplies(list => [{
      no, catalog: form.catalog || '（未选择目录）', org: form.org,
      term: form.term, time: nowStamp(), status: '待审核',
    }, ...list]);
    setRecords(rs => rs.map(r =>
      r.name === form.catalog && r.status === '已发布' ? { ...r, status:'待审核' } : r));
    setConfirmOpen(false);
    setForm(f => ({ ...f, usage:'', pledge:false }));
    setErrs({});
    goScreen('myapply');
    say('申请已提交，进入部门审核流程');
  }

  const myCount = applies.length;

  /* ================= 各屏 ================= */
  const ScreenWorkbench = (
    <section data-screen-label="工作台">
      <div className="kpis">
        {[['目录总数', 1284, ''], ['已发布', 967, 'var(--ok)'],
          ['待我审核', 48, 'var(--warn)'], ['我的申请', myCount, '']].map(([k, v, c]) => (
          <div className="kpi" key={k}>
            <span className="k">{k}</span>
            <span className="v" style={{ color: c || 'inherit' }}>{v}</span>
          </div>
        ))}
      </div>
      <div className="sect">待办</div>
      <div className="panel">
        <dl className="dl">
          <dt>共享申请</dt><dd>待审核 <b>48</b> 条，其中超期 <b>3</b> 条</dd>
          <dt>目录变更</dt><dd>待确认 6 条</dd>
          <dt>归集异常</dt><dd>2 个批次需要处理</dd>
        </dl>
      </div>
    </section>
  );

  const ScreenCatalog = (
    <section data-screen-label="数据资源目录">
      <div className="toolbar">
        <div className="search">
          <IconSearch />
          <input id="q" value={kw} placeholder="搜索目录名称或提供单位"
                 aria-label="搜索目录"
                 onChange={e => { setKw(e.target.value); setPage(1); }} />
        </div>
        <Segmented label="共享类型筛选" options={SHARE_FILTERS} value={share}
                   onChange={v => { setShare(v); setPage(1); }} />
        <span className="count" id="count-line">
          符合条件 {filtered.length} 条 / 全部 {records.length} 条
        </span>
        <button className="btn btn-primary spacer" id="btn-new"
                onClick={() => say('原型范围外：新建目录流程未展开')}>
          <IconPlus />新建目录
        </button>
      </div>

      <div className="panel">
        {pageRows.length
          ? <CatalogTable rows={pageRows} sort={sort} onSort={changeSort}
                          selectedId={openId} onOpen={openRecordById} />
          : <div className="empty">没有符合条件的目录，试试调整搜索词或共享类型</div>}
        {filtered.length > 0 && (
          <Pager page={cur} pages={pages} total={filtered.length} onPage={setPage} />
        )}
      </div>
    </section>
  );

  const ScreenGather = (
    <section data-screen-label="数据归集">
      <div className="kpis">
        {[['今日归集批次', 42, ''], ['归集记录', '1,286 万', ''], ['成功率', '99.2%', 'var(--ok)']]
          .map(([k, v, c]) => (
          <div className="kpi" key={k}><span className="k">{k}</span>
            <span className="v" style={{ color: c || 'inherit' }}>{v}</span></div>
        ))}
      </div>
      <div className="panel">
        <dl className="dl">
          <dt>异常批次</dt><dd>3 个批次失败，均为上游接口超时</dd>
          <dt>待处理工单</dt><dd>2 条</dd>
          <dt>最近一次成功</dt><dd>2026-10-07 09:12</dd>
        </dl>
      </div>
    </section>
  );

  const usageLen = form.usage.trim().length;
  const ScreenApply = (
    <section data-screen-label="共享申请">
      <div className="steps">
        {[['填写申请', true], ['部门审核', false], ['授权开通', false]].map(([label, on], i) => (
          <React.Fragment key={label}>
            {i > 0 && <span className="bar" />}
            <span className="s" data-on={on}><span className="d">{i + 1}</span>{label}</span>
          </React.Fragment>
        ))}
      </div>

      <form className="panel" style={{ padding:'20px 22px', maxWidth:'660px' }}
            id="apply-form" onSubmit={submitApply} noValidate>
        <div className="field">
          <label htmlFor="f-catalog"><span className="req">*</span>申请目录</label>
          <div className="ctl">
            <input className="inp" id="f-catalog" readOnly value={form.catalog}
                   placeholder="从「数据资源目录」点击目录行带入"
                   onChange={() => {}} />
            <div className="help">由目录详情抽屉的「申请共享」带入，也可在上方列表选择后带入</div>
          </div>
        </div>

        <div className="field">
          <label htmlFor="f-org"><span className="req">*</span>申请单位</label>
          <div className="ctl">
            <input className="inp" id="f-org" value={form.org}
                   onChange={e => setForm(f => ({ ...f, org:e.target.value }))} />
          </div>
        </div>

        <div className="field">
          <label htmlFor="f-type">共享类型</label>
          <div className="ctl">
            <select className="sel" id="f-type" value={form.type}
                    onChange={e => setForm(f => ({ ...f, type:e.target.value }))}>
              <option>有条件共享</option><option>无条件共享</option>
            </select>
          </div>
        </div>

        <div className="field">
          <label htmlFor="f-term">使用期限</label>
          <div className="ctl">
            <select className="sel" id="f-term" value={form.term}
                    onChange={e => setForm(f => ({ ...f, term:e.target.value }))}>
              {CYCLE_OPTIONS.map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
        </div>

        <div className="field">
          <label htmlFor="f-usage"><span className="req">*</span>申请用途</label>
          <div className="ctl">
            <textarea className="ta" id="f-usage" value={form.usage}
                      placeholder="说明使用场景、数据范围，以及不用于其他用途的承诺（不少于 10 字）"
                      aria-invalid={!!errs.usage}
                      onChange={e => setForm(f => ({ ...f, usage:e.target.value }))} />
            <div className={'help' + (errs.usage ? ' err' : '')} id="usage-help">
              {errs.usage || `已输入 ${usageLen} 字`}
            </div>
          </div>
        </div>

        <div className="field">
          <label>数据安全承诺</label>
          <div className="ctl">
            <label className="check" htmlFor="f-pledge">
              <input type="checkbox" id="f-pledge" checked={form.pledge}
                     onChange={e => setForm(f => ({ ...f, pledge:e.target.checked }))} />
              <span>本单位承诺依法依规使用数据，落实分类分级保护要求，不向第三方转供。</span>
            </label>
            {errs.pledge && <div className="help err">{errs.pledge}</div>}
          </div>
        </div>

        <div style={{ display:'flex', gap:'8px', justifyContent:'flex-end', paddingTop:'4px' }}>
          <button type="button" className="btn btn-ghost" id="btn-cancel-apply"
                  onClick={() => goScreen('catalog')}>取消</button>
          <button type="submit" className="btn btn-primary" id="btn-submit">提交申请</button>
        </div>
      </form>
    </section>
  );

  const ScreenMyApply = (
    <section data-screen-label="我的申请">
      <div className="panel">
        {applies.length ? (
          <div className="scroll">
            <table>
              <thead><tr>
                <th style={{ width:'78px' }}>单号</th>
                <th>申请目录</th>
                <th style={{ width:'150px' }}>申请单位</th>
                <th style={{ width:'76px' }}>期限</th>
                <th style={{ width:'124px' }}>提交时间</th>
                <th style={{ width:'84px' }}>状态</th>
              </tr></thead>
              <tbody id="myapply-body">
                {applies.map(a => (
                  <tr key={a.no} style={{ cursor:'default' }}>
                    <td className="mono">{a.no}</td>
                    <td className="name">{a.catalog}</td>
                    <td className="org">{a.org}</td>
                    <td className="dim">{a.term}</td>
                    <td className="time">{a.time}</td>
                    <td><Status value={a.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : <div className="empty">暂无申请记录</div>}
      </div>
    </section>
  );

  const ScreenMonitor = (
    <section data-screen-label="监控管理">
      <div className="kpis">
        {[['接口调用', '8,624', ''], ['失败', 12, 'var(--danger)'], ['平均响应', '186 ms', '']]
          .map(([k, v, c]) => (
          <div className="kpi" key={k}><span className="k">{k}</span>
            <span className="v" style={{ color: c || 'inherit' }}>{v}</span></div>
        ))}
      </div>
      <div className="panel">
        <dl className="dl">
          <dt>告警</dt>
          <dd>
            <span className="st st-rev"><i />中</span>
            {' '}低保对象查询接口 5xx 占比 0.6%（近 1 小时）
          </dd>
          <dt>处置建议</dt><dd>检查上游汇聚任务 2026-10-07 批次是否延迟</dd>
        </dl>
      </div>
    </section>
  );

  const SCREENS = {
    workbench: ScreenWorkbench, catalog: ScreenCatalog, gather: ScreenGather,
    apply: ScreenApply, myapply: ScreenMyApply, monitor: ScreenMonitor,
  };

  const TITLES = {
    workbench:['工作台','首页 / 工作台'],
    catalog:['数据资源目录','首页 / 数据管理 / 数据资源目录'],
    gather:['数据归集','首页 / 数据管理 / 数据归集'],
    apply:['共享申请','首页 / 服务与运营 / 共享申请'],
    myapply:['我的申请','首页 / 服务与运营 / 我的申请'],
    monitor:['监控管理','首页 / 服务与运营 / 监控管理'],
  };

  return (
    <>
      {/* ⚠️ 结构要点：浮层（抽屉/弹窗/Toast）必须放在 .app 之外。
          .app 是 display:grid 容器，若浮层作为它的子元素，会被当成 grid item 排进下一行；
          浏览器里 position:fixed 能侥幸脱流，但静态渲染器会真的把它排到内容下方。
          放在 grid 之外才是正确结构。 */}
      <div className="app">
        <Sidebar screen={screen} onGo={goScreen} myCount={myCount} />
        <div className="main">
          <div className="head">
            <div>
              <h1>{TITLES[screen][0]}</h1>
              <div className="path">{TITLES[screen][1]}</div>
            </div>
            <div className="right">
              <button className="icon-btn" id="btn-theme" aria-label="切换深色模式"
                      title="切换深色 / 浅色"
                      onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}>
                {theme === 'light' ? <IconMoon /> : <IconSun />}
              </button>
            </div>
          </div>
          <div className="body" id="screen-body">
            {SCREENS[screen]}
          </div>
        </div>
      </div>

      <DetailDrawer open={!!openRecord} record={openRecord} tab={drawerTab}
                    onTab={setDrawerTab} onClose={() => setOpenId(null)}
                    onApply={startApply} />

      <ConfirmModal open={confirmOpen}
                    text={`申请目录：${form.catalog || '—'}；使用期限：${form.term}。提交后进入部门审核流程。`}
                    onCancel={() => setConfirmOpen(false)}
                    onOk={confirmApply} />

      <Toast msg={toast.msg} open={toast.open} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

/* 供自动化测试驱动（jsdom）。仅暴露只读查询与少量动作，不改设计逻辑。 */
window.__proto = {
  screen: () => (document.querySelector('[aria-current="page"]') || {}).id,
  rows: () => document.querySelectorAll('tbody#myapply-body tr, .panel tbody tr').length,
  rowCount: () => document.querySelectorAll('.panel tbody tr').length,
  drawerOpen: () => document.querySelector('.drawer').getAttribute('data-open') === 'true',
  modalOpen: () => document.querySelector('.modal').getAttribute('data-open') === 'true',
  toast: () => document.querySelector('.toast').textContent,
  toastOpen: () => document.querySelector('.toast').getAttribute('data-open') === 'true',
  theme: () => document.documentElement.getAttribute('data-theme'),
  activeTab: () => (document.querySelector('.tabs [aria-selected="true"]') || {}).textContent,
  applyRows: () => document.querySelectorAll('#myapply-body tr').length,
  countLine: () => document.querySelector('#count-line').textContent.trim(),
};
document.documentElement.setAttribute('data-ready', '1');

</script>
</body>
</html>
