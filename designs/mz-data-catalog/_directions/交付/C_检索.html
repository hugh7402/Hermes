<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>方向 C · 检索 · 民政数据资源目录</title>
<!--
  方向 C · 检索 (Query)
  ------------------------------------------------------------------
  气质定位：假设使用者已经知道要什么，只是要最快拿到。所以不给仪表盘、
            不给表格、不给侧栏——只给一个输入框和结果流。像用 Raycast/Spotlight
            找文件，而不是像逛后台。
  主导角色：前端工程师 + 文案（交互节奏优先，字要少）

  与 A/B 的差异：
    · 交互模型：A「逐行读」、B「空间定位」、C「直接问」——键盘优先，无鼠标也能用
    · 视觉语言：A 暖纸宋体、B 冷图纸等宽、C 纯黑白大字距（几乎无彩色）
    · 信息密度：C 刻意最稀，一次只让你看清一条

  反 slop 对照：无渐变、无 emoji、无圆角卡片墙、无侧边栏+左 border accent 那套；
    唯一彩色是一条 3px 的激活标线，其余全靠字重与留白。
-->
<style>
:root{
  --ink:#0f1214;
  --ink-2:#4b5459;
  --ink-3:#9aa3a8;
  --hair:#e3e6e8;         /* 发丝线 */
  --hair-2:#c3c9cc;
  --accent:#0b6b5b;       /* 深松绿 —— 全页唯一彩色，只标"当前这一条" */
  --bg:#fff;
  --wash:#f6f7f8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.7; text-wrap:pretty;
  min-height:100vh; display:flex; justify-content:center;
  padding:74px 28px 90px;
}
.wrap{width:100%; max-width:860px}

/* 抬头：极简，只有一行小字 */
.eyebrow{
  font-size:11px; letter-spacing:3.5px; color:var(--ink-3);
  text-transform:uppercase; margin-bottom:34px;
}
.eyebrow b{color:var(--ink-2); font-weight:500; letter-spacing:2px}

/* 命令输入 */
.ask{position:relative; border-bottom:2px solid var(--ink); padding-bottom:12px}
/* 用 class 选择器而非 `input` 标签选择器：出图时会把 <input> 换成同样 class 的
   <span>（静态渲染器完全不渲染 input，连边框都不画），class 才能让样式照旧生效。*/
.ask .field{
  display:inline-block; width:100%; border:none; background:none; outline:none;
  font-family:inherit; font-size:31px; font-weight:600;
  letter-spacing:-.4px; color:var(--ink); padding-right:60px;
}
.ask .field::placeholder{color:#c9cfd3; font-weight:500; letter-spacing:-.2px}
.ask .mark{
  position:absolute; right:0; bottom:14px; font-size:11px; letter-spacing:1.5px;
  color:var(--ink-3);
}
.ask .mark kbd{
  font-family:inherit; font-size:10.5px; border:1px solid var(--hair-2);
  padding:1px 5px; color:var(--ink-2); margin-left:4px;
}

/* 提示行 */
/* 提示行：inline 流 + float:right（不用 flex+auto 外距，静态渲染器会把右侧项压到 min-content）*/
.hints{
  padding:11px 0 0;
  font-size:11.5px; color:var(--ink-3); letter-spacing:.6px;
}
.hints > span{display:inline; margin-right:22px}
.hints kbd{
  font-family:inherit; font-size:11px; border:1px solid var(--hair-2);
  padding:1px 5px; color:var(--ink-2); margin-right:3px;
}
.hints .right{float:right; margin-right:0; font-feature-settings:"tnum"; color:var(--ink-2)}

/* 结果流 */
.results{margin-top:30px; border-top:1px solid var(--hair)}
.row{position:relative; border-bottom:1px solid var(--hair); cursor:pointer}
.row:hover{background:var(--wash)}
.row[aria-selected="true"]{background:var(--wash)}
.row[aria-selected="true"]::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);
}
.row-main{display:grid; grid-template-columns:26px 1fr auto; align-items:baseline;
  gap:0 16px; padding:15px 14px 15px 18px}
.row .idx{font-size:11px; color:var(--ink-3); font-feature-settings:"tnum"}
.row .nm{font-size:15.5px; font-weight:600; letter-spacing:-.2px}
.row .nm .code{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:10.5px; font-weight:400; color:var(--ink-3); margin-left:9px; letter-spacing:0;
}
.row .org{display:block; font-size:12px; color:var(--ink-3); margin-top:3px}
.row .stat{font-size:12px; color:var(--ink-2); text-align:right; white-space:nowrap;
  font-feature-settings:"tnum"}
.row .stat .lbl{color:var(--ink-3); font-size:11px; margin-right:4px}
.tag{
  display:inline-block; font-size:10.5px; letter-spacing:.8px;
  border:1px solid var(--hair-2); color:var(--ink-2); padding:0 6px; margin-left:8px;
  vertical-align:1px;
}
.tag.hot{border-color:var(--accent); color:var(--accent)}

/* 展开的详情：不是弹窗、不是抽屉，就长在这一行下面 */
.detail{
  display:none; padding:4px 14px 22px 60px;
  border-left:3px solid var(--accent); background:var(--wash);
}
.row[aria-selected="true"] .detail{display:block}
.detail .lede{font-size:13px; color:var(--ink-2); line-height:1.85; max-width:640px;
  margin-bottom:16px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 40px}
dl.spec{display:grid; grid-template-columns:72px 1fr; font-size:12.5px}
dl.spec dt{color:var(--ink-3); font-size:11.5px; padding:6px 0; border-bottom:1px solid var(--hair)}
dl.spec dd{padding:6px 0; border-bottom:1px solid var(--hair); overflow-wrap:anywhere}
dl.spec dd.hot{color:var(--accent); font-weight:600}
.flds{width:100%; border-collapse:collapse; font-size:12px}
.flds td{padding:6px 0; border-bottom:1px solid var(--hair)}
.flds td:first-child{width:96px; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11.5px}
.flds td:nth-child(2){width:58px; color:var(--ink-3)}
.detail .act{margin-top:18px; white-space:nowrap}
.btn{
  display:inline; padding:6px 15px; font-family:inherit; font-size:12.5px;
  background:var(--bg); border:1px solid var(--hair-2); color:var(--ink-2);
  letter-spacing:.5px; cursor:pointer; margin-right:10px;
}
.btn:hover{border-color:var(--ink); color:var(--ink)}
.btn-p{background:var(--ink); border-color:var(--ink); color:#fff}
.btn-p:hover{background:#000; color:#fff}
.btn:disabled{opacity:.35; cursor:not-allowed}

/* 空态 */
.none{padding:60px 0; text-align:center; color:var(--ink-3); font-size:13px}
.none b{display:block; font-size:15px; color:var(--ink-2); font-weight:600; margin-bottom:6px}

/* 底部条 */
.foot{
  margin-top:34px;
  font-size:11.5px; color:var(--ink-3); letter-spacing:.6px;
  border-top:1px solid var(--hair); padding-top:14px;
}
.chips{display:inline}
.chips button{
  display:inline; border:none; background:none; font-family:inherit; font-size:11.5px;
  color:var(--ink-3); cursor:pointer; padding:0; letter-spacing:.6px;
  border-bottom:1.5px solid transparent; margin-right:16px;
}
.chips button:hover{color:var(--ink-2)}
.chips button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--ink); font-weight:600}
.foot .right{float:right; font-feature-settings:"tnum"}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">省民政厅 · 数据资源目录 <b>／ 检索</b></div>

  <div class="ask">
    <input id="q" class="field" type="search" autocomplete="off" spellcheck="false"
           placeholder="输入目录名称、编码或提供处室…" aria-label="检索数据资源目录">
    <span class="mark">聚焦 <kbd>⌘</kbd><kbd>K</kbd></span>
  </div>

  <div class="hints">
    <span class="right" id="count">—</span>
    <span><kbd>↑</kbd><kbd>↓</kbd>切换</span>
    <span><kbd>↵</kbd>展开详情</span>
    <span><kbd>esc</kbd>清空</span>
  </div>

  <div class="results" id="results" role="listbox" aria-label="检索结果"></div>

  <div class="foot">
    <span class="right">数据截至 2026-10-06</span>
    <div class="chips" role="group" aria-label="共享类型筛选">
      <button data-v="全部" aria-pressed="true">全部类型</button>
      <button data-v="无条件共享" aria-pressed="false">无条件</button>
      <button data-v="有条件共享" aria-pressed="false">有条件</button>
      <button data-v="不予共享" aria-pressed="false">不予共享</button>
    </div>
  </div>

</div>

<script>
/* ⚠️ 以下 innerHTML 只渲染本文件内硬编码的 DATA 常量，无外部输入、无网络请求。 */
const DATA = [
  [1,'低保对象基础信息','MZ-SH-0001','社会救助处',126000,'无条件共享','低',false,'全省城乡最低生活保障对象的基本信息、家庭成员构成、救助金额与发放记录。',[['xm','string','姓名'],['sfzh','string','身份证号（脱敏）'],['bjje','decimal','本月保障金额']]],
  [2,'特困人员供养信息','MZ-SH-0002','社会救助处',34000,'无条件共享','低',false,'特困人员救助供养对象、供养方式、供养标准及资金发放情况。',[['xm','string','姓名'],['gyfs','string','供养方式'],['gybz','decimal','供养标准']]],
  [3,'养老服务设施台账','MZ-YL-0007','养老服务处',8120,'有条件共享','中',false,'全省养老机构、社区养老服务设施的基础信息、床位规模与运营主体。',[['jdmc','string','机构名称'],['dj','string','机构等级'],['cws','int','床位数']]],
  [4,'社会组织登记信息','MZ-ZZ-0021','社会组织管理局',57000,'有条件共享','中',false,'社会组织成立、变更、注销登记信息及年度检查结论。',[['zzmc','string','组织名称'],['tyshxydm','string','统一社会信用代码'],['djrq','date','登记日期']]],
  [5,'婚姻登记信息（脱敏）','MZ-SW-0003','社会事务处',2860000,'有条件共享','高',true,'婚姻登记记录。身份证号、住址等敏感字段已按分类分级要求脱敏。',[['jhdjsj','date','结婚登记时间'],['sfzh','string','身份证号（脱敏）'],['djjg','string','登记机关']]],
  [6,'殡葬服务单位信息','MZ-SW-0011','社会事务处',1036,'无条件共享','低',false,'殡仪馆、公墓等殡葬服务单位的基本情况与服务能力。',[['dwmc','string','单位名称'],['lxdh','string','联系电话'],['dz','string','地址']]],
  [7,'残疾人两项补贴发放','MZ-CJ-0005','残疾人福利处',248000,'无条件共享','中',true,'困难残疾人生活补贴、重度残疾人护理补贴的发放对象与金额明细。',[['xm','string','姓名'],['btlx','string','补贴类型'],['ffje','decimal','发放金额']]],
  [8,'行政区划与地名数据','MZ-QH-0001','区划地名处',42000,'无条件共享','低',false,'行政区划代码、层级、变更沿革以及标准地名信息。',[['qhdm','string','行政区划代码'],['qhmc','string','名称'],['jb','string','层级']]],
  [9,'儿童福利机构信息','MZ-ET-0002','儿童福利处',418,'有条件共享','中',false,'儿童福利院、未成年人保护机构的基础信息与床位使用情况。',[['jdmc','string','机构名称'],['cws','int','床位数']]],
  [10,'慈善组织公开募捐','MZ-CS-0003','慈善事业促进处',21000,'无条件共享','低',false,'慈善组织公开募捐方案备案信息与募捐进展。',[['zzmc','string','组织名称'],['fa','string','募捐方案'],['je','decimal','募得金额']]],
  [11,'高龄津贴发放信息','MZ-YL-0019','养老服务处',382000,'无条件共享','中',true,'高龄老人津贴发放对象、标准与逐月发放记录。',[['xm','string','姓名'],['nl','int','年龄'],['btbz','decimal','补贴标准']]],
  [12,'社会组织年检结果','MZ-ZZ-0044','社会组织管理局',18000,'不予共享','高',true,'社会组织年度检查结论与整改情况，仅限内部监管使用。',[['zzmc','string','组织名称'],['njjl','string','年检结论']]],
  [13,'社会救助家庭经济核对','MZ-SH-0009','社会救助处',96000,'有条件共享','高',true,'低保、特困等救助对象的家庭经济状况核对结果与疑似问题清单。',[['xm','string','姓名'],['hdbm','string','核对部门'],['hdyy','string','核对原因']]],
  [14,'志愿服务组织与项目','MZ-CS-0017','慈善事业促进处',15400,'无条件共享','低',false,'志愿服务组织备案信息与志愿服务项目实施情况。',[['zzmc','string','组织名称'],['xmmc','string','项目名称'],['fwsc','int','服务时长']]],
];
const fmt = n => n >= 10000 ? (n/10000).toFixed(1) + ' 万' : n.toLocaleString('zh-CN');
let kw = '', share = '全部', cur = 0, open = null;

const match = () => {
  const q = kw.trim().toLowerCase();
  return DATA.filter(d =>
    (!q || (d[1] + d[2] + d[3]).toLowerCase().includes(q)) &&
    (share === '全部' || d[5] === share));
};

function draw(){
  const rs = match();
  if (cur >= rs.length) cur = Math.max(0, rs.length - 1);
  const box = document.getElementById('results');
  if (!rs.length){
    box.innerHTML = `<div class="none"><b>没有匹配的目录</b>试试换个关键词，或用底部的共享类型筛选</div>`;
    document.getElementById('count').textContent = '0 项';
    return;
  }
  box.innerHTML = rs.map((d, i) => {
    const on = open === d[0];
    const hot = d[5] !== '无条件共享' || d[6] === '高';
    const sel = (open === null && i === cur) || on;
    return `<div class="row" role="option" data-id="${d[0]}" data-i="${i}" aria-selected="${sel}">
      <div class="row-main">
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span>
          <span class="nm">${d[1]}<span class="code">${d[2]}</span></span>
          <span class="org">${d[3]} · ${d[5]}${d[6]==='高'?' · 高风险':''}</span>
        </span>
        <span class="stat"><span class="lbl">记录</span>${fmt(d[4])}${
          hot ? '<span class="tag hot">需留意</span>' : ''}</span>
      </div>
      <div class="detail">
        <p class="lede">${d[8]}</p>
        <div class="grid2">
          <dl class="spec">
            <dt>编码</dt><dd>${d[2]}</dd>
            <dt>提供处室</dt><dd>${d[3]}</dd>
            <dt>共享类型</dt><dd class="${d[5]==='不予共享'?'hot':''}">${d[5]}</dd>
            <dt>敏感级别</dt><dd class="${d[6]==='高'?'hot':''}">${d[6]} 级</dd>
            <dt>是否脱敏</dt><dd>${d[7] ? '是（身份证号、住址等）' : '否'}</dd>
          </dl>
          <table class="flds"><tbody>${d[9].map(f =>
            `<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('')}</tbody></table>
        </div>
        <div class="act">
          <button class="btn" data-act="close">收起</button>
          <button class="btn btn-p" data-act="apply" ${d[5]==='不予共享'?'disabled':''}>申请共享</button>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('count').textContent = `${rs.length} 项 · 共 ${
    fmt(rs.reduce((a,b)=>a+b[4],0))} 条记录`;
}

function move(d){
  const rs = match(); if (!rs.length) return;
  cur = (cur + d + rs.length) % rs.length;
  open = null; draw();
  const el = document.querySelector('.row[data-i="'+cur+'"]');
  if (el && el.scrollIntoView) el.scrollIntoView({block:'nearest'});
}
document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value; cur = 0; open = null; draw();
});
document.getElementById('results').addEventListener('click', e => {
  if (e.target.closest('[data-act="close"]')){ open = null; draw(); return; }
  if (e.target.closest('[data-act="apply"]')) return;   /* 原型：不实现提交 */
  const row = e.target.closest('.row');
  if (row){ const id = +row.dataset.id; open = (open === id) ? null : id; cur = +row.dataset.i; draw(); }
});
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => {
  share = b.dataset.v; cur = 0; open = null;
  document.querySelectorAll('.chips button').forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  draw();
}));
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault(); document.getElementById('q').focus(); return;
  }
  if (e.key === 'ArrowDown'){ e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); move(-1); }
  else if (e.key === 'Enter'){
    const rs = match(); if (rs.length){ open = rs[cur][0]; draw(); }
  } else if (e.key === 'Escape'){
    kw = ''; open = null; cur = 0;
    document.getElementById('q').value = ''; draw();
  }
});
draw();
window.__dirC = { rows: () => document.querySelectorAll('.row').length,
  open: () => open, cur: () => cur,
  count: () => document.getElementById('count').textContent,
  detailShown: () => document.querySelectorAll('.detail').length };
</script>
</body>
</html>
