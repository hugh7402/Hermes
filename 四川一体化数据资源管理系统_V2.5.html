<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四川省一体化数据资源管理系统</title>
<style>
/* ==========================================================================
   四川一体化数据资源管理系统
   设计令牌 —— 配色取自实测（国办发〔2017〕47号 + 真实门户 CSS）
   中国政府网 www.gov.cn 主色 #015293 / 亮蓝 #2691e2 / 中国红 #d9000d
   ========================================================================== */
:root{
  /* 主色调（≤3 种，国办发47号要求） */
  --pri:#015293;          /* 主色 深蓝 */
  --pri-2:#2691e2;        /* 辅色 亮蓝 */
  --pri-3:#2e5586;        /* 辅色 深蓝变体（hover/二级） */
  --red:#d9000d;          /* 点缀 中国红 —— 仅警示/重要，绝不做装饰 */

  /* 主色派生 */
  --pri-dk:#013f70;       /* 顶栏渐变深端 */
  --pri-08:rgba(1,82,147,.08);
  --pri-12:rgba(1,82,147,.12);
  --pri-l:#e8f1f9;        /* 浅蓝底 —— 表头/选中态 */
  --pri-l2:#f2f7fc;
  --pri-bd:#c5d9ec;

  /* 中性 */
  --bg:#f7f7f7;
  --white:#fff;
  --bd:#dce3ea;
  --bd-2:#e8edf2;
  --t1:#222;              /* 正文 */
  --t2:#555;
  --t3:#888;
  --t4:#aaa;
  --head:#f5f8fb;         /* 表头底（浅蓝灰） */

  /* 语义状态色（政务系统普遍保留；无障碍要求不靠颜色单传 → 一律配文字+图标） */
  --ok:#1e7e34;  --ok-bg:#e8f5ea;  --ok-bd:#b7dfbf;
  --warn:#b26a00; --warn-bg:#fff4e5; --warn-bd:#f0d3a8;
  --danger:#c62828; --danger-bg:#fdecec; --danger-bd:#f2c2c2;
  --info:#015293; --info-bg:#e8f1f9; --info-bd:#c5d9ec;
  --mute:#6b7280; --mute-bg:#f0f2f5; --mute-bd:#dfe3e8;

  /* 尺寸 —— 政务庄重：圆角 2-4px，近乎直角 */
  --r:2px;
  --r2:4px;
  --fs:13px;
  --lh:1.6;
  --topbar-h:52px;
  --sysnav-h:36px;   /* 系统导航行（两个系统切换） */
  --subnav-h:36px;
  --side-w:212px;
  --font:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Hiragino Sans GB","WenQuanYi Zen Hei",-apple-system,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); font-size:var(--fs); line-height:var(--lh);
  color:var(--t1); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
a{color:var(--pri);text-decoration:none}

/* ── 顶栏：深蓝，机构全称显著展示（国办发47号） ─────────────────── */
.topbar{
  background:linear-gradient(90deg,var(--pri-dk) 0%,var(--pri) 55%,var(--pri-3) 100%);
  color:#fff; height:var(--topbar-h);
  display:flex; align-items:center; gap:14px; padding:0 20px;
  position:relative; z-index:60;
}
.topbar .emblem{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#ffd76a 0 30%,#e8a33d 31% 62%,#c07a1c 63% 100%);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.55) inset; flex:0 0 26px;
}
.topbar .brand{display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.topbar .brand b{font-size:15px;font-weight:600;letter-spacing:.4px}
.topbar .brand span{font-size:11px;opacity:.82}
.topbar .sysname{
  margin-left:8px;padding-left:14px;border-left:1px solid rgba(255,255,255,.28);
  font-size:13px;opacity:.95;
}
.topbar .spacer{flex:1}
.topbar .usertools{display:flex;align-items:center;gap:2px;font-size:12px}
.topbar .usertools a{
  color:#fff;opacity:.9;padding:5px 9px;border-radius:var(--r);
}
.topbar .usertools a:hover{background:rgba(255,255,255,.14);opacity:1}
.topbar .who{
  margin-left:8px;padding:4px 10px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);border-radius:var(--r);font-size:12px;
}
.topbar .who b{font-weight:600}

/* ── 主导航：白底 + 选中主色下划线 ─────────────────────────────── */
/* ── 系统导航行（数据目录管理系统 / 数据归集管理系统）───────── */
.sysnav{
  background:#eef4fa;border-bottom:1px solid var(--bd);
  height:var(--sysnav-h);display:flex;align-items:stretch;padding:0 14px;
  position:relative;z-index:56;
}
.sysnav .sn-label{
  display:flex;align-items:center;font-size:12px;color:var(--t4);padding-right:12px;
}
.sysnav .sn{
  display:flex;align-items:center;gap:7px;padding:0 20px;font-size:14px;color:var(--t2);
  cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;position:relative;
}
.sysnav .sn .dot{width:6px;height:6px;border-radius:50%;background:var(--t4);flex:0 0 6px}
.sysnav .sn:hover{color:var(--pri);background:rgba(255,255,255,.75)}
.sysnav .sn.on{color:var(--pri);font-weight:700;background:var(--white);border-bottom-color:var(--pri)}
.sysnav .sn.on .dot{background:var(--pri)}
.sysnav .sn .cur{
  font-size:10px;font-weight:400;color:var(--pri);background:var(--pri-l);
  border:1px solid var(--pri-bd);border-radius:var(--r);padding:0 5px;line-height:15px;
}

/* ── 业务进度条（目录生命周期状态）────────────────────────── */
.pipeline{
  background:var(--pri-l2);border-bottom:1px solid var(--bd);
  height:var(--subnav-h);display:flex;align-items:center;padding:0 18px;gap:0;
  font-size:12px;overflow:hidden;
}
.pipeline .pl-label{color:var(--t3);margin-right:12px;white-space:nowrap}
.pipeline .st{display:flex;align-items:center;gap:6px;color:var(--t3);white-space:nowrap}
.pipeline .st i{
  width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:10px;color:var(--t3);flex:0 0 16px;
}
.pipeline .st.done{color:var(--ok)}
.pipeline .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.pipeline .st.now{color:var(--pri);font-weight:600}
.pipeline .st.now i{background:var(--pri);border-color:var(--pri);color:#fff}
.pipeline .arw{width:22px;height:1px;background:var(--bd);margin:0 8px;flex:0 0 22px}

/* ── 主体两栏 ─────────────────────────────────────────────────── */
.wrap{display:flex;height:calc(100vh - var(--topbar-h) - var(--sysnav-h) - var(--subnav-h));overflow:hidden}
.side{
  width:var(--side-w);flex:0 0 var(--side-w);background:#fff;
  border-right:1px solid var(--bd);overflow-y:auto;padding:6px 0 18px;
}
.side .grp{
  padding:10px 16px 6px;font-size:11px;color:var(--t4);letter-spacing:.6px;
  text-transform:uppercase;
}
.side .mi{
  display:flex;align-items:center;gap:8px;padding:8px 16px;color:var(--t2);
  cursor:pointer;border-left:3px solid transparent;font-size:13px;
}
.side .mi:hover{background:var(--pri-l2);color:var(--pri)}
.side .mi.on{
  background:var(--pri-l);color:var(--pri);font-weight:600;border-left-color:var(--pri);
}
.side .mi .ic{width:14px;text-align:center;opacity:.75;font-size:12px;flex:0 0 14px}
/* 标签过长时省略号截断，不要把角标挤走或折行 */
.side .mi .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .mi .bdg{
  flex:0 0 auto;margin-left:6px;background:var(--red);color:#fff;font-size:10px;
  line-height:1;padding:2px 5px;border-radius:8px;font-weight:600;
}
.side .mi.lock{color:var(--t4);cursor:not-allowed}
.side .mi.lock:hover{background:transparent;color:var(--t4)}

.main{flex:1;overflow:hidden;padding:0;min-width:0;display:flex;flex-direction:column}
/* 内容区独立滚动；操作栏放在滚动区之外，因此永远不会压住内容 */
.mainscroll{flex:1;overflow-y:auto;padding:14px 20px 22px;min-width:0}
.mainfoot{flex:0 0 auto;background:#fff;border-top:1px solid var(--bd);
          box-shadow:0 -2px 8px rgba(0,0,0,.05);z-index:20}

/* ── 面包屑 + 页标题（底部 2px 主色横线）──────────────────────── */
.crumb{color:var(--t3);font-size:12px;margin-bottom:9px}
.crumb b{color:var(--pri);font-weight:400}
.pagetitle{
  display:flex;align-items:flex-end;gap:12px;
  border-bottom:2px solid var(--pri);padding-bottom:8px;margin-bottom:14px;
}
.pagetitle h1{margin:0;font-size:16.5px;font-weight:600;color:var(--t1);letter-spacing:.2px}
.pagetitle .sub{color:var(--t3);font-size:12px;padding-bottom:2px}
.pagetitle .right{margin-left:auto;display:flex;gap:8px;align-items:center;padding-bottom:1px}

/* ── 按钮（真实盒子；政务风近乎直角）──────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 15px;font-size:13px;border:1px solid var(--bd);background:#fff;
  color:var(--t1);border-radius:var(--r);cursor:pointer;line-height:1.3;
  white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-l2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-dk);border-color:var(--pri-dk);color:#fff}
.btn.pri2{background:var(--pri-2);border-color:var(--pri-2);color:#fff}
.btn.pri2:hover{filter:brightness(.93);color:#fff}
.btn.dgr{background:#fff;border-color:var(--danger-bd);color:var(--danger)}
.btn.dgr:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.lg{padding:8px 22px;font-size:14px}
.btn:disabled,.btn.dis{opacity:.45;cursor:not-allowed;background:#f6f7f9;color:var(--t3);border-color:var(--bd)}
.btn:disabled:hover,.btn.dis:hover{border-color:var(--bd);color:var(--t3);background:#f6f7f9}

/* 链接式操作（表格操作列）*/
.ops{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.ops a{color:var(--pri);cursor:pointer;padding:1px 5px;border-radius:var(--r)}
.ops a:hover{background:var(--pri-l);text-decoration:underline}
.ops a.mut{color:var(--t3)}
.ops a.dgr{color:var(--danger)}
.ops .sep{color:var(--bd);user-select:none}

/* ── 状态标签：小尺寸、浅底深字、方正（不用药丸）──────────────── */
.tag{
  display:inline-flex;align-items:center;gap:3px;padding:1px 7px;font-size:12px;
  line-height:1.55;border-radius:var(--r);border:1px solid transparent;white-space:nowrap;
}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.tag.danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-bd)}
.tag.info{color:var(--info);background:var(--info-bg);border-color:var(--info-bd)}
.tag.mute{color:var(--mute);background:var(--mute-bg);border-color:var(--mute-bd)}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.tag .dot.i{width:0;height:0;border-radius:0;background:none;font-size:11px;line-height:1}

/* ── 卡片 / 分组面板 ─────────────────────────────────────────── */
.panel{background:#fff;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px}
.panel>.ph{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  background:var(--head);border-bottom:1px solid var(--bd);
}
.panel>.ph h3{margin:0;font-size:13.5px;font-weight:600;color:var(--t1)}
.panel>.ph .n{
  background:var(--pri);color:#fff;font-size:11px;width:17px;height:17px;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;flex:0 0 17px;
}
.panel>.ph .meta{margin-left:auto;color:var(--t3);font-size:12px;font-weight:400}
.panel>.pb{padding:12px 14px}
.panel.fold>.pb{display:none}
.panel.fold>.ph{cursor:pointer}
.caret{margin-left:auto;color:var(--t3);font-size:11px;transition:transform .15s}
.panel.fold .caret{transform:rotate(-90deg)}

/* ── 表单：栅格 + 条件显隐 + 错误定位（回应对手"长表单不可折叠、无锚点"）── */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 18px}
.fgrid.c2{grid-template-columns:repeat(2,1fr)}
.fgrid.c1{grid-template-columns:1fr}
.fi{display:flex;flex-direction:column;gap:4px;min-width:0}
.fi.span2{grid-column:span 2}
.fi.span3{grid-column:span 3}
.fi label{font-size:12.5px;color:var(--t2);display:flex;align-items:center;gap:4px}
.fi label .req{color:var(--red);font-weight:600}
.fi label .hint{
  margin-left:auto;color:var(--t3);font-size:11px;cursor:help;
  border:1px solid var(--bd);border-radius:50%;width:14px;height:14px;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 14px;
  font-style:normal;line-height:1;
}
.fi .ctl{
  min-height:30px;border:1px solid var(--bd);border-radius:var(--r);background:#fff;
  padding:5px 9px;font-size:12.5px;color:var(--t1);display:flex;align-items:center;
  gap:6px;width:100%;
}
.fi .ctl:focus,.fi .ctl:focus-within{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-12);outline:none}
.fi .ctl.ro{background:#f6f7f9;color:var(--t3);border-style:dashed}
.fi .ctl .lock{color:var(--t3);font-size:11px}
.fi .ctl input,.fi .ctl select,.fi .ctl textarea{
  border:0;outline:0;background:transparent;font-family:inherit;font-size:12.5px;
  color:var(--t1);width:100%;padding:0;
}
.fi .ctl textarea{resize:vertical;min-height:44px;line-height:1.5}
.fi.err .ctl{border-color:var(--danger);background:var(--danger-bg)}
.fi.err label{color:var(--danger)}
.fi .msg{font-size:11.5px;color:var(--danger);display:none}
.fi.err .msg{display:block}
.fi .tl{font-size:11.5px;color:var(--t3)}
.chip{
  background:var(--pri-l);border:1px solid var(--pri-bd);color:var(--pri);
  padding:1px 6px;border-radius:var(--r);font-size:12px;
  display:inline-flex;gap:5px;align-items:center;white-space:nowrap;
}
.chip .chip-x{cursor:pointer;font-style:normal;opacity:.65;font-size:11px}
.chip .chip-x:hover{opacity:1;color:var(--red)}
.chip-add{width:auto;border-left:1px solid var(--bd-2);padding-left:5px}

/* 条件字段（如 回流切分字段 / 不允许回流原因）*/
.cond{display:none}
.cond.on{display:flex}

/* 表单锚点导航（回应"长表单易迷失"）*/
.formnav{
  width:150px;flex:0 0 150px;align-self:flex-start;position:sticky;top:0;
  background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:8px 0;
}
.formnav .fn-h{padding:4px 12px 8px;font-size:11px;color:var(--t4);border-bottom:1px solid var(--bd-2);margin-bottom:4px}
.formnav a{
  display:flex;align-items:center;gap:6px;padding:6px 12px;color:var(--t2);cursor:pointer;font-size:12.5px;
  border-left:3px solid transparent;
}
.formnav a:hover{background:var(--pri-l2);color:var(--pri)}
.formnav a.on{color:var(--pri);background:var(--pri-l);border-left-color:var(--pri);font-weight:600}
.formnav a .st{margin-left:auto;font-size:11px}
.formnav a .st.done{color:var(--ok)}
.formnav a .st.err{color:var(--danger)}

/* ── 错误汇总条（提交失败可一键定位）──────────────────────────── */
.errbar{
  display:none;background:var(--danger-bg);border:1px solid var(--danger-bd);
  border-left:3px solid var(--danger);border-radius:var(--r);padding:9px 13px;margin-bottom:12px;
}
.errbar.on{display:block}
.errbar b{color:var(--danger)}
.errbar ul{margin:5px 0 0;padding-left:18px}
.errbar li{cursor:pointer;color:var(--danger);font-size:12.5px}
.errbar li:hover{text-decoration:underline}

/* ── 吸底操作条（回应"长表单按钮在底部要滚动"）────────────────── */
/* 注意：操作条由 render() 从屏幕 HTML 中抽出，放到滚动区之外（见 .mainfoot），
   因此这里不再用 position:sticky —— sticky 在滚动容器内必然压住内容。 */
.actbar{
  background:#fff;padding:10px 20px;display:flex;align-items:center;gap:9px;
  justify-content:flex-end;
  border:0;margin:0;box-shadow:none;
}
.actbar .tip{color:var(--t3);font-size:12px;margin-right:auto}
.actbar .tip b{color:var(--pri)}

/* ── 检索条 ─────────────────────────────────────────────────── */
.filters{
  display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;
}
.filters .f{display:flex;align-items:center;gap:6px}
.filters .f label{color:var(--t2);font-size:12.5px;white-space:nowrap}
.filters .f .inp{
  border:1px solid var(--bd);border-radius:var(--r);padding:5px 8px;font-size:12.5px;
  min-width:148px;font-family:inherit;color:var(--t1);background:#fff;
}
.filters .f .inp:focus{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-12);outline:none}
.filters .more{display:none}
.filters.open .more{display:flex}
.filters .toggle{
  color:var(--pri);cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:3px;
  margin-left:auto;
}
.filters .toggle:hover{text-decoration:underline}

/* ── 表格：浅蓝表头 + 固定表头 + 数字右对齐（回应对手卡片列表）── */
.tblwrap{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:auto;max-height:100%}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{
  background:var(--head);color:var(--t2);font-weight:600;text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;
  position:sticky;top:0;z-index:2;
}
table.data th.n,table.data td.n{text-align:right;font-variant-numeric:tabular-nums}
table.data th.c,table.data td.c{text-align:center}
table.data td{padding:7px 10px;border-bottom:1px solid var(--bd-2);color:var(--t1);vertical-align:middle}
table.data tbody tr:hover{background:var(--pri-l2)}
table.data tbody tr.sel{background:var(--pri-l)}
table.data td .ell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
table.data tbody tr.sum{background:#fffdf5;font-weight:600}
table.data tbody tr.sum:hover{background:#fffdf5}

/* ── 分页 ───────────────────────────────────────────────────── */
.pager{
  display:flex;align-items:center;gap:9px;padding:10px 13px;background:#fff;
  border:1px solid var(--bd);border-top:0;border-radius:0 0 var(--r) var(--r);font-size:12.5px;color:var(--t2);
}
.pager .cnt{margin-right:auto;color:var(--t3)}
.pager .pages{display:flex;gap:3px}
.pager .pg{
  min-width:26px;height:26px;border:1px solid var(--bd);background:#fff;border-radius:var(--r);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 6px;color:var(--t1);
  font-size:12.5px;font-family:inherit;
}
.pager .pg:hover:not(:disabled):not(.on){border-color:var(--pri);color:var(--pri)}
.pager .pg.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.pager .pg:disabled{color:var(--t4);cursor:not-allowed;background:#fafbfc}

/* ── 统计卡 ─────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:12px}
.kpis.c4{grid-template-columns:repeat(4,1fr)}
.kpis.c3{grid-template-columns:repeat(3,1fr)}
.kpi{
  background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;
  border-top:2.5px solid var(--pri);position:relative;
}
.kpi.k-ok{border-top-color:var(--ok)}
.kpi.k-warn{border-top-color:var(--warn)}
.kpi.k-danger{border-top-color:var(--danger)}
.kpi.k-red{border-top-color:var(--red)}
.kpi .k-l{color:var(--t2);font-size:12.5px;display:flex;align-items:center;gap:5px}
.kpi .k-v{
  font-size:25px;font-weight:600;color:var(--pri);line-height:1.24;
  font-variant-numeric:tabular-nums;letter-spacing:-.4px;
}
.kpi.k-ok .k-v{color:var(--ok)}
.kpi.k-warn .k-v{color:var(--warn)}
.kpi.k-danger .k-v{color:var(--danger)}
.kpi .k-u{font-size:12px;font-weight:400;color:var(--t3);margin-left:3px}
.kpi .k-s{color:var(--t3);font-size:11.5px;margin-top:2px}

/* 算术等式条（五项数字自洽可视化 —— 压对手的关键） */
.eqbar{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--bd);border-left:3px solid var(--pri);border-radius:var(--r);
  padding:9px 14px;margin-bottom:12px;font-size:12.5px;color:var(--t2);
}
.eqbar .op{color:var(--t3);font-weight:600}
.eqbar b{color:var(--pri);font-variant-numeric:tabular-nums}
.eqbar .chk{color:var(--ok);display:inline-flex;align-items:center;gap:4px;margin-left:auto}

/* ── 条形图 / 环形（纯 CSS+SVG，无外链）────────────────────── */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:96px 1fr 62px;gap:9px;align-items:center;font-size:12.5px}
.bar-row .bl{color:var(--t2)}
/* ⚠️ 必须显式 display:block —— span 是 inline，百分比宽度解析不出会变成 0 */
.bar-row .bt{display:block;background:#eef2f6;height:15px;border-radius:1px;overflow:hidden}
.bar-row .bf{display:block;height:100%;min-width:2px;background:var(--pri);transition:width .3s}
.bar-row .bf.ok{background:var(--ok)}
.bar-row .bf.warn{background:var(--warn)}
.bar-row .bf.danger{background:var(--danger)}
.bar-row .bv{text-align:right;color:var(--t1);font-variant-numeric:tabular-nums}

/* ── 抽屉 / 弹窗（保留原值视窗·转换视窗等）──────────────────── */
.scrim{
  position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,30,45,.42);
  opacity:0;visibility:hidden;transition:opacity .16s;z-index:200;
}
.scrim.on{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:760px;max-width:96vw;background:#fff;
  box-shadow:-3px 0 16px rgba(0,0,0,.14);transform:translateX(100%);
  transition:transform .2s;z-index:210;display:flex;flex-direction:column;
}
.drawer.on{transform:translateX(0)}
.drawer.wide{width:980px}
.drawer .dh{
  padding:12px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;
  background:var(--head);flex:0 0 auto;
}
.drawer .dh h3{margin:0;font-size:14.5px;font-weight:600}
.drawer .dh .x{margin-left:auto;cursor:pointer;color:var(--t3);font-size:17px;line-height:1;padding:2px 7px;border-radius:var(--r)}
.drawer .dh .x:hover{background:#e6ebf0;color:var(--t1)}
.drawer .db{padding:15px 18px;overflow-y:auto;flex:1}
.drawer .df{
  padding:10px 18px;border-top:1px solid var(--bd);display:flex;gap:9px;justify-content:flex-end;
  background:#fafbfc;flex:0 0 auto;
}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);
  width:520px;max-width:94vw;background:#fff;max-height:88vh;overflow-y:auto;border-radius:var(--r2);z-index:220;
  box-shadow:0 10px 34px rgba(0,0,0,.24);opacity:0;visibility:hidden;transition:opacity .16s,transform .16s;
}
.modal.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.modal .mh{padding:12px 18px;border-bottom:1px solid var(--bd);font-size:14.5px;font-weight:600}
.modal .mb{padding:16px 18px;font-size:13px}
.modal .mf{padding:11px 18px;border-top:1px solid var(--bd);display:flex;gap:9px;justify-content:flex-end;background:#fafbfc}

/* ── 提示条 ─────────────────────────────────────────────────── */
.notice{
  display:flex;gap:9px;align-items:flex-start;padding:9px 13px;border-radius:var(--r);
  border:1px solid var(--info-bd);background:var(--info-bg);color:var(--t1);
  font-size:12.5px;margin-bottom:12px;
}
.notice.warn{border-color:var(--warn-bd);background:var(--warn-bg)}
.notice.ok{border-color:var(--ok-bd);background:var(--ok-bg)}
.notice.danger{border-color:var(--danger-bd);background:var(--danger-bg)}
.notice .ic{font-weight:700;color:var(--pri);flex:0 0 auto}
.notice.warn .ic{color:var(--warn)}
.notice.ok .ic{color:var(--ok)}
.notice.danger .ic{color:var(--danger)}
.notice b{color:var(--t1)}

/* ── 键值对展示（详情页）───────────────────────────────────── */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.kv.c3{grid-template-columns:repeat(3,1fr)}
.kv .r{display:flex;border-bottom:1px solid var(--bd-2);min-width:0}
.kv .r:nth-child(2n){border-right:0}
.kv.c3 .r:nth-child(3n){border-right:0}
.kv .k{
  background:var(--head);color:var(--t2);padding:7px 11px;flex:0 0 132px;
  border-right:1px solid var(--bd-2);font-size:12.5px;
}
.kv .v{padding:7px 11px;color:var(--t1);flex:1;min-width:0;word-break:break-all;font-size:12.5px}
.kv .full{grid-column:1/-1}
.kv .full .k{flex:0 0 132px}

/* ── 对比视窗（保留原值 / 转换）──────────────────────────── */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch;
     border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.cmp .side-c{padding:10px 13px;min-width:0}
.cmp .side-c.src{background:#fff8f0}
.cmp .side-c.dst{background:#f0f8f1}
.cmp .side-c .h{font-size:12px;color:var(--t3);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.cmp .side-c .val{
  font-size:15px;font-weight:600;color:var(--t1);word-break:break-all;
  font-variant-numeric:tabular-nums;
}
.cmp .side-c.src .val{color:var(--warn)}
.cmp .side-c.dst .val{color:var(--ok)}
.cmp .mid{
  display:flex;align-items:center;justify-content:center;padding:0 12px;color:var(--t3);
  font-size:17px;background:#fafbfc;border-left:1px solid var(--bd);border-right:1px solid var(--bd);
}

/* ── 流程时间线（建表时间比对）────────────────────────────── */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:1.5px;background:var(--bd)}
.tl .ti{position:relative;padding:0 0 13px}
.tl .ti:last-child{padding-bottom:0}
.tl .ti::before{
  content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--pri);
}
.tl .ti.done::before{background:var(--ok);border-color:var(--ok)}
.tl .ti .tt{font-size:12.5px;color:var(--t1);font-weight:600}
.tl .ti .td{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}

/* ── 底部功能区（国办发47号列明项；用流转文本行，不用一堆 inline-block）── */
.footer .ver{margin-left:14px;color:var(--t4);font-size:12px}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;user-select:none}
.sw i{width:32px;height:18px;border-radius:9px;background:#cfd8e3;position:relative;transition:.15s;flex:0 0 32px}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--pri)}
.sw.on i::after{left:16px}
.sw.on{color:var(--pri);font-weight:600}
.sw.off{color:var(--t3)}
.tl .ti.todo{opacity:.45}
.tl .ti.now .tt{color:var(--pri);font-weight:600}
.footer{
  background:#fff;border-top:1px solid var(--bd);
  padding:9px 20px;font-size:11.5px;color:var(--t3);line-height:1.85;text-align:center;
}
.footer a{color:var(--t3)}
.footer a:hover{color:var(--pri);text-decoration:underline}
.footer .fk{margin:0 5px}

/* ── 通用 ───────────────────────────────────────────────────── */
/* ── 调试开关（Ctrl+D）：悬停元素显示定位信息 ─────────────────── */
.dbgbox{
  position:fixed;right:12px;bottom:12px;z-index:400;width:540px;max-width:48vw;
  background:#141e28;color:#cfe0ee;font:12px/1.7 "SF Mono",Consolas,monospace;
  border-radius:3px;box-shadow:0 6px 22px rgba(0,0,0,.4);overflow:hidden;
  pointer-events:none;   /* 不拦截鼠标：否则面板下方的元素悬停不到 */
}
.dbgbox .dbgh{background:#0d1620;padding:7px 12px;display:flex;align-items:center;
  pointer-events:auto;   /* 仅标题栏可点，「复制」按钮保持可用 */
  font-weight:600;color:#8fc4e8;border-bottom:1px solid #24323f;font-family:var(--font);}
.dbgbox .dbgcopy{margin-left:auto;cursor:pointer;background:#1d4d75;color:#fff;
  padding:2px 9px;border-radius:2px;font-size:11px;font-family:var(--font);}
.dbgbox .dbgcopy:hover{background:#2a6798}
.dbgbox #dbgtxt{padding:9px 12px;max-height:34vh;overflow:auto}
.dbgbox .dbgr{margin-bottom:3px;word-break:break-all}
.dbgbox .dbgr b{color:#e8a33d;margin-right:5px}
.dbgbox .dbgsel{color:#7fd48a}
.dbgout{outline:2px solid #ff5c5c !important;outline-offset:1px;
  background:rgba(255,92,92,.07) !important}
/* 已锁定的元素用琥珀色描边，与普通悬停的红色区分 */
.dbgpin{outline:2px solid #ffb020 !important;outline-offset:1px;
  background:rgba(255,176,32,.13) !important}
.dbgbox .dbglock{background:#b26a00;color:#fff;padding:1px 7px;border-radius:2px;font-size:11px}
.dbgbox .dbghint{margin-top:6px;padding-top:6px;border-top:1px solid #24323f;
  color:#8fa8bd;font-size:11px;font-family:var(--font)}
.dbgbox .dbghint b{color:#e8a33d}
#dbgraw{cursor:text}

.row{display:flex;gap:10px;align-items:center}

.grow{flex:1}
.t-r{text-align:right}.t-c{text-align:center}
.mut{color:var(--t3)}
.sm{font-size:12px}
.mono{font-family:"SF Mono",Consolas,"Courier New",monospace;font-size:12px}
.nowrap{white-space:nowrap}
.hidden{display:none !important}

.toast{

.flowcard .fc-line{width:100%;height:1px;background:#cdd9e6}
.flowcard .fc-lb{font-size:11.5px;color:#4b5563;text-align:center;padding:5px 0;line-height:1.5}
.flowcard.done .fc-lb b{color:#2e7d32}
.flowcard .fc-a .fc-line:first-child{position:relative}
.flowcard .fc-a .fc-line:first-child:after{content:"▶";position:absolute;right:-1px;top:-8px;
  font-size:11px;color:#cdd9e6}

/* ── 角色权限门（反馈第 57 条）：无权限时内容区操作不可用 ── */
.rolebar{background:#fdecec;border-color:#f2bcbc;border-left-color:#c62828}

.rolebar .btn{margin-left:auto}
/* 无办理权限时：仅禁用「办理类主操作按钮」（查看类链接保持可用——权限分离） */
.main[data-gated="1"] .mainfoot .btn,

.topbar .usertools .roledrop.deny{background:#c62828;border-color:#ffd6d6;color:#fff}
.toast.warn{background:#b26a00;color:#fff}

/* 权限门覆盖抽屉/弹窗（它们在 .main 之外，故用 body 作用域） */
body[data-gated="1"] #drawer-foot .btn,
body[data-gated="1"] #modal-foot .btn{opacity:.5;cursor:not-allowed}

[data-gated="1"] .vg{opacity:1 !important;cursor:pointer !important}
[data-gated="1"] .vg.pri{background:var(--pri) !important;border-color:var(--pri) !important;color:#fff}

  /* ── 浏览器内解析 xlsx（零依赖：ZIP 目录 + DecompressionStream + DOMParser）──
     xlsx 就是 ZIP；只需支持 stored(0) 与 deflate(8)，Chrome 原生即可解压。 */
  function unzipEntries(buf) {
    var dv = new DataView(buf), u8 = new Uint8Array(buf), out = [], p = -1, i;
    for (i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 66000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { p = i; break; }
    }
    if (p < 0) throw new Error('不是有效的 xlsx 文件（未找到 ZIP 目录）');
    var n = dv.getUint16(p + 10, true), off = dv.getUint32(p + 16, true);
    for (var k = 0; k < n; k++) {
      if (dv.getUint32(off, true) !== 0x02014b50) { break; }
      var method = dv.getUint16(off + 10, true);
      var csize = dv.getUint32(off + 20, true);
      var nlen = dv.getUint16(off + 28, true);
      var elen = dv.getUint16(off + 30, true);
      var clen = dv.getUint16(off + 32, true);
      var lho = dv.getUint32(off + 42, true);
      var name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nlen));
      var lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      var st = lho + 30 + lnlen + lelen;
      out.push({ name: name, method: method, data: u8.subarray(st, st + csize) });
      off += 46 + nlen + elen + clen;
    }
    return out;
  }

  function entryText(buf, name) {
    var e = unzipEntries(buf).filter(function (x) { return x.name === name; })[0];
    if (!e) return Promise.resolve(null);
    if (e.method === 0) return Promise.resolve(new TextDecoder().decode(e.data));
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('当前浏览器不支持解压，请使用 Chrome / Edge 打开'));
    }
    var st = new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(st).text();
  }

  function sheetRows(xml, shared) {
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var out = [], rl = doc.getElementsByTagName('row'), i, j, q;
    for (i = 0; i < rl.length; i++) {
      var row = [], cl = rl[i].getElementsByTagName('c');
      for (j = 0; j < cl.length; j++) {
        var c = cl[j], ref = c.getAttribute('r') || '', col = 0, m = ref.match(/^[A-Z]+/);
        if (m) { for (q = 0; q < m[0].length; q++) { col = col * 26 + (m[0].charCodeAt(q) - 64); } col -= 1; }
        var typ = c.getAttribute('t'), v = c.getElementsByTagName('v')[0], val = '';
        if (typ === 's' && v) { val = shared[parseInt(v.textContent, 10)] || ''; }
        else if (typ === 'inlineStr') {
          var is = c.getElementsByTagName('is')[0]; val = is ? is.textContent : '';
        } else if (v) { val = v.textContent; }
        row[col] = val;
      }
      out.push(row);
    }
    return out;
  }

  /* 读 xlsx 的全部工作表 —— 返回 [[[cell,...],...], ...] */
  function xlsxSheets(buf) {
    return entryText(buf, 'xl/sharedStrings.xml').then(function (ss) {
      var shared = [];
      if (ss) {
        var d = new DOMParser().parseFromString(ss, 'application/xml');
        var si = d.getElementsByTagName('si');
        for (var i = 0; i < si.length; i++) {
          var ts = si[i].getElementsByTagName('t'), s = '';
          for (var j = 0; j < ts.length; j++) { s += ts[j].textContent; }
          shared.push(s);
        }
      }
      var names = unzipEntries(buf).map(function (x) { return x.name; })
        .filter(function (n) { return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); })
        .sort(function (a, b) {
          return parseInt(a.replace(/\D+/g, ''), 10) - parseInt(b.replace(/\D+/g, ''), 10);
        });
      if (!names.length) throw new Error('文件中未找到工作表');
      return Promise.all(names.map(function (n) { return entryText(buf, n); }))
        .then(function (xs) { return xs.map(function (x) { return x ? sheetRows(x, shared) : []; }); });
    });
  }

  function roleFor(sc) {
    if (sc === 's1' || sc === 's1b' || sc === 's5b') return 'editor';
    if (sc === 's2') return 'audit1';
    if (sc === 's3' || sc === 's3b') return 'biz';          // 归集工单创建与业务审核（目录系统）
    if (sc === 's4' || sc === 's4b' || sc === 's4c' || sc === 's4d' || sc === 's5') return 'collect';
    return 'govern';
  }

  /* 当前办理角色：显式指定，未指定时取初始环节角色 */
  function roleCurrent() {
    return (S.role && ROLES[S.role]) ? S.role : 'editor';
  }

  /* 当前角色是否具备本环节办理权限 */
  function roleAllowed() {
    return roleCurrent() === roleFor(S.screen);
  }

  /* 底部功能区 —— 国办发〔2017〕47号要求列明项（用流转文本行，不用一堆 span）*/
  function renderFooter() {
    return '<div class="footer">' +
      '<span class="fk">党政机关网站标识</span>·' +
      '<span class="fk">政府网站标识码：XXXXXXXXXX</span>·' +
      '<span class="fk"><a>ICP备案编号：XXXXXXXX号</a></span>·' +
      '<span class="fk"><a>公安机关备案标识：XXXXXXXXXXXXX号</a></span>·' +
      '<span class="fk">网站主办单位：四川省大数据中心</span>·' +
      '<span class="fk">联系电话：028-XXXXXXXX</span>·' +
      '<span class="fk"><a>站点地图</a></span>' +
      '<span class="ver">版本 ' + VERSION + '</span>' +
      '</div>';
  }

  /* ── 事件绑定 ─────────────────────────────────────────────── */
  function bindShell() {
    // 输入即清错：字段被修正后自动去掉红色错误态（否则出现「值已合法但仍标红」）
    if (!window.__errClearBound) {
      window.__errClearBound = true;
      var clr = function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        var fi = t.closest('.fi.err');
        if (fi) fi.classList.remove('err');
      };
      document.addEventListener('input', clr, true);
      document.addEventListener('change', clr, true);
    }
    document.querySelectorAll('[data-menu]').forEach(function (el) {
      el.onclick = function () { go(el.getAttribute('data-menu')); };
    });
    document.querySelectorAll('[data-sys]').forEach(function (el) {
      el.onclick = function () {
        var k = el.getAttribute('data-sys');
        var target = (SYSTEMS[k] && SYSTEMS[k].home) || 's1b';
        go(target);
      };
    });
    document.querySelectorAll('[data-stage]').forEach(function (el) {
      el.onclick = function () { toast(el.textContent); };
    });
    var x = document.getElementById('drawer-x'); if (x) x.onclick = closeDrawer;
    var sc = document.getElementById('scrim'); if (sc) sc.onclick = function () { closeDrawer(); closeModal(); };
  }

  /* ── 路由 ─────────────────────────────────────────────────── */
  /* 权限门：当前角色无本环节办理权限时，阻断操作并提示在右上角切换角色 */
  function roleBar() {
    if (roleAllowed()) { return ''; }
    var need = roleFor(S.screen), n = ROLES[need], cur = ROLES[roleCurrent()];
    return '<div class="rolebar"><span class="ic">✕</span>' +
      '<span>本环节须由「<b>' + esc(n.role) + '</b>（' + esc(n.name) + ' · ' + esc(n.org) +
      '）」办理；当前角色「' + esc(cur.role) + '」无该权限，无法继续操作。' +
      '请在右上角切换为「' + esc(n.role) + '」后继续。</span>' +
      '<span class="btn sm pri" id="btn-role-fix">切换为' + esc(n.role) + '</span></div>';
  }

  /* 被权限门管控的办理动作选择器 */
  var GATED_SEL = '.mainfoot .btn, .screen .actbar .btn, #modal-foot .btn, #drawer-foot .btn';

  /* 权限门豁免：查看 / 导出 / 跳转 / 取消类动作不挡 —— 真实系统里查看与办理是分离的权限 */
  var VIEW_ACT_IDS = {
    'btn-cancel': 1, 'back-cat': 1, 'back-collect': 1,
    'btn-export': 1, 'btn-export2': 1, 'p-export': 1,
    'go-inst': 1, 'go-clean': 1, 'go-clean2': 1, 'go-summary': 1,
    'go-src': 1, 'go-task': 1, 'go-task2': 1, 'to-task': 1
  };
  var VIEW_ACT_RE = /^(查看|导出|下载|查询|重置|返回|取消|关闭|展开|前往|预览|详情|明细|打印)/;
  function isViewAct(el) {
    if (!el || !el.tagName) { return false; }
    if (el.id === 'btn-role-fix') { return true; }
    if (el.id && VIEW_ACT_IDS[el.id]) { return true; }
    return VIEW_ACT_RE.test((el.innerText || el.textContent || '').trim());
  }
  /* 给豁免按钮打标记，视觉灰化随之豁免（不加则出现「看着被禁其实能用」的矛盾） */
  function markViewActs() {
    [].slice.call(document.querySelectorAll(GATED_SEL)).forEach(function (el) {
      if (isViewAct(el)) { el.classList.add('vg'); }
      else { el.classList.remove('vg'); }
    });
  }

  /* 权限门：无办理权限时点击办理动作，给出明确反馈（而不是毫无反应） */
  document.addEventListener('click', function (e) {
    if (roleAllowed()) { return; }
    var el = e.target && e.target.closest ? e.target.closest(GATED_SEL) : null;
    if (!el || isViewAct(el)) { return; }   /* 查看类不拦，只拦办理 */
    e.preventDefault();
    e.stopPropagation();
    var need = ROLES[roleFor(S.screen)];
    toast('当前角色无本环节办理权限，请在右上角切换为「' + need.role + '」', 'warn');
  }, true);

  /* 轻量角色切换：只更新顶栏与权限门，不重绘屏幕内容（避免冲掉已打开的弹窗/抽屉） */
  function setRoleSoft(k) {
    if (!ROLES[k] || S.role === k) { return; }
    S.role = k;
    var r = ROLES[k];
    var wu = document.getElementById('who-user'), wr = document.getElementById('who-role');
    var wo = document.getElementById('who-org');
    if (wu) { wu.textContent = r.name; }
    if (wr) { wr.textContent = r.role.split('（')[0]; }
    if (wo) { wo.textContent = r.org; }
    var m = document.querySelector('.main');
    if (m) {
      if (roleAllowed()) { m.removeAttribute('data-gated'); }
      else { m.setAttribute('data-gated', '1'); }
    }
    if (roleAllowed()) { document.body.removeAttribute('data-gated'); }
    else { document.body.setAttribute('data-gated', '1'); }
    markViewActs();
    var br = document.getElementById('btn-role');
    if (br) { br.classList.toggle('deny', !roleAllowed()); }
    var bar = document.querySelector('.rolebar');
    if (bar && roleAllowed()) { bar.parentNode.removeChild(bar); }
  }

  /* 切换办理角色（角色未变化时不重绘，避免冲掉已打开的弹窗/抽屉） */
  function setRole(k) {
    if (!ROLES[k] || S.role === k) { return; }
    S.role = k;
    var r = ROLES[k];
    render();
    toast('已切换为「' + r.role + ' · ' + r.name + '」', 'ok');
  }

  /* 切换角色面板 */
  function openRoleSwitch() {
    var cur = roleCurrent();
    var need = roleFor(S.screen);
    var order = ROLE_ORDER.slice();
    if (order.indexOf(need) > 0) {                 // 本环节所需角色排到最前
      order.splice(order.indexOf(need), 1);
      order.unshift(need);
    }
    openModal('切换角色',
      '<div class="notice"><span class="ic">i</span><div>系统按角色区分办理权限，' +
      '各办理环节须由对应角色操作。请切换为当前环节所需角色后继续。</div></div>' +
      '<div class="rolelist">' +
      order.map(function (k) {
        var r = ROLES[k];
        return '<div class="rl' + (k === cur ? ' on' : '') + '" data-role="' + k + '">' +
          '<div class="rl-l"><div class="rl-r">' + esc(r.role) +
          (k === need ? '<span class="tag need">本环节所需</span>' : '') + '</div>' +
          '<div class="rl-d">' + esc(r.duty) + '</div></div>' +
          '<div class="rl-r2"><span>' + esc(r.org) + '</span><b>' + esc(r.name) + '</b>' +
          (k === cur ? '<span class="tag ok">当前</span>' : '') + '</div></div>';
      }).join('') + '</div>',
      '<span class="btn" data-close="1">取消</span>');
    document.getElementById('modal').classList.add('rolepanel');
    document.querySelectorAll('.rolelist .rl').forEach(function (el) {
      el.onclick = function () { closeModal(); setRole(el.getAttribute('data-role')); };
    });

  }

  function go(sc) {
    if (!META[sc]) { toast('该模块暂未开放'); return; }
    var prev = S.screen;
    S.screen = sc;
    var obj = window.SCREENS[sc];
    // 进入「新」屏幕时才重置屏内状态（筛选/分页等）——否则每次渲染都会被重置
    if (prev !== sc && obj && obj.enter) obj.enter();
    render();
    var m = document.querySelector('.mainscroll'); if (m) m.scrollTop = 0;
  }

  /* ── 抽屉 / 弹窗 / toast ─────────────────────────────────── */
  function openDrawer(title, html, footHtml, wide) {
    var d = document.getElementById('drawer');
    document.getElementById('drawer-title').textContent = title;
    document.getElementById('drawer-body').innerHTML = html;
    document.getElementById('drawer-foot').innerHTML = footHtml || '<span class="btn" data-close="1">关闭</span>';
    d.className = 'drawer' + (wide ? ' wide' : '');
    requestAnimationFrame(function () {
      d.classList.add('on');
      document.getElementById('scrim').classList.add('on');
    });
    document.querySelectorAll('[data-close]').forEach(function (el) {
      el.onclick = function () { closeDrawer(); };
    });
    if (typeof window.AFTER_DRAWER === 'function') window.AFTER_DRAWER();
    markViewActs();
  }
  function closeDrawer() {
    var d = document.getElementById('drawer'); if (!d) return;
    d.classList.remove('on');
    document.getElementById('scrim').classList.remove('on');
  }
  function openModal(title, body, foot) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = body;
    document.getElementById('modal-foot').innerHTML = foot || '<span class="btn pri" data-close-m="1">确定</span>';
    document.getElementById('modal').classList.add('on');
    document.getElementById('scrim').classList.add('on');
    document.querySelectorAll('[data-close-m]').forEach(function (el) {
      el.onclick = function () { closeModal(); };
    });
    if (typeof window.AFTER_MODAL === 'function') window.AFTER_MODAL();
    markViewActs();
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('rolepanel');
    var m = document.getElementById('modal'); if (!m) return;
    m.classList.remove('on');
    if (!document.getElementById('drawer').classList.contains('on'))
      document.getElementById('scrim').classList.remove('on');
  }
  var toastTimer = null;
  function toast(text, kind) {
    var t = document.getElementById('toast'); if (!t) return;
    t.textContent = text;
    // 抽屉打开时把 toast 挪到「剩余可见区域」的中央，否则会压在抽屉上
    var d = document.getElementById('drawer');
    var open = d && d.classList.contains('on');
    if (open) {
      var dw = d.getBoundingClientRect().width || 0;
      t.style.left = Math.max(140, Math.round((window.innerWidth - dw) / 2)) + 'px';
      t.style.bottom = '132px';        // 抬高，避开吸底操作条
    } else {
      t.style.left = '50%';
      t.style.bottom = '76px';
    }
    t.className = 'toast on' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  /* ── 调试开关（Ctrl+D / Cmd+D）───────────────────────────────
     悬停任意元素 → 右下角浮出定位信息；
     ★ 点击该元素即可「锁定并自动复制」，不会触发系统本身的功能；
       锁定后鼠标随便移动，面板信息不再变化，可从容点【复制】或按 C 再复制；
     Esc 解锁；再按 Ctrl+D 关闭调试模式。对外使用时默认关闭。 */
  var dbg = false, dbgLast = null, dbgPin = null;

  /* 报告用的 class 必须剔掉调试自身加的高亮类 */
  function cleanCls(cn) {
    return (typeof cn === 'string' ? cn : '')
             .replace(/\bdbgout\b/g, '').replace(/\bdbgpin\b/g, '').trim();
  }
  function cssPath(el) {
    var parts = [];
    while (el && el.nodeType === 1 && parts.length < 7) {
      var s = el.tagName.toLowerCase();
      if (el.id) { parts.unshift(s + '#' + el.id); break; }
      var cls = cleanCls(el.className).split(/\s+/).filter(Boolean).slice(0, 2);
      if (cls.length) s += '.' + cls.join('.');
      var p = el.parentElement;
      if (p) {
        var sib = Array.prototype.filter.call(p.children, function (x) { return x.tagName === el.tagName; });
        if (sib.length > 1) s += ':nth-of-type(' + (sib.indexOf(el) + 1) + ')';
      }
      parts.unshift(s);
      el = p;
    }
    return parts.join(' > ');
  }
  function dbgInfo(el) {
    if (!el || el.nodeType !== 1) return null;
    return {
      screen: S.screen, sys: S.sys, tag: el.tagName.toLowerCase(),
      id: el.id || '(无)',
      cls: cleanCls(el.className) || '(无)',
      path: cssPath(el),
      text: (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60)
    };
  }
  function dbgRender(el) {
    var box = document.getElementById('dbgtxt'); if (!box) return;
    var i = dbgInfo(el);
    if (!i) { box.textContent = '把鼠标移到任意元素上，点击即可锁定并复制'; return; }
    box.innerHTML =
      '<div class="dbgr"><b>屏</b>' + esc(i.screen) + '　<b>系统</b>' + esc(i.sys) +
        (dbgPin ? '　<span class="dbglock">已锁定</span>' : '') + '</div>' +
      '<div class="dbgr"><b>元素</b>' + esc(i.tag) + '</div>' +
      '<div class="dbgr"><b>id</b>' + esc(i.id) + '</div>' +
      '<div class="dbgr"><b>class</b>' + esc(i.cls) + '</div>' +
      '<div class="dbgr"><b>选择器</b><span class="dbgsel">' + esc(i.path) + '</span></div>' +
      '<div class="dbgr"><b>文本</b>' + esc(i.text) + '</div>' +
      '<div class="dbghint">' +
        (dbgPin ? '已锁定，鼠标移动不影响本面板　按 <b>Esc</b> 解锁'
                : '点击元素＝锁定并复制　按 <b>C</b> 复制当前　<b>Esc</b> 解锁') +
      '</div>';
  }
  function dbgText() {
    var i = dbgInfo(dbgPin || dbgLast);
    if (!i) return null;
    var NL = String.fromCharCode(10);   // 用字符码构造换行，避免反斜杠转义在各层被吞
    return '屏 ' + i.screen + '｜系统 ' + i.sys + '｜元素 ' + i.tag +
           '｜id ' + i.id + '｜class ' + i.cls + NL +
           '选择器 ' + i.path + NL +
           '文本 ' + i.text;
  }
  function dbgCopy(quiet) {
    var txt = dbgText();
    if (!txt) { toast('请先把鼠标移到要反馈的元素上，或点击该元素'); return false; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
    } catch (err) { /* 降级：下方 select 可手动复制 */ }
    // 兜底：把文本塞进面板里的只读输入框，剪贴板 API 受限时可手动 Ctrl+C
    var ta = document.getElementById('dbgraw');
    if (ta) { ta.value = txt; ta.style.display = 'block'; }
    if (!quiet) toast(dbgPin ? '已复制（已锁定元素）' : '已复制当前元素', 'ok');
    return true;
  }
  window.__dbgCopy = function (e) { if (e) e.stopPropagation(); dbgCopy(); };
  function dbgLock(el) {
    if (!el || el.nodeType !== 1) return;
    if (dbgLast) dbgLast.classList.remove('dbgout');
    dbgPin = el;
    el.classList.add('dbgpin');
    dbgRender(el);
  }
  function dbgUnlock(quiet) {
    if (dbgPin) dbgPin.classList.remove('dbgpin');
    dbgPin = null;
    if (dbgLast) { dbgLast.classList.remove('dbgout'); dbgLast = null; }
    if (!quiet) toast('已解锁，可继续选取元素');
    dbgRender(null);
  }
  function toggleDebug(force) {
    dbg = (typeof force === 'boolean') ? force : !dbg;
    var box = document.getElementById('dbgbox');
    if (box) box.style.display = dbg ? 'block' : 'none';
    document.body.style.cursor = dbg ? 'crosshair' : '';
    dbgUnlock(true);
    var ta = document.getElementById('dbgraw'); if (ta) ta.style.display = 'none';
    if (dbg) dbgRender(null);
    toast(dbg ? '调试模式已开启：悬停查看，点击元素即锁定并复制（Ctrl+D 关闭）'
              : '调试模式已关闭', dbg ? 'ok' : '');
  }
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) {
      e.preventDefault(); toggleDebug(); return;
    }
    if (!dbg) return;
    var t = e.target, inField = t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
    if (e.key === 'Escape') { e.preventDefault(); dbgUnlock(); return; }
    if (!inField && (e.key === 'c' || e.key === 'C') && !e.ctrlKey && !e.metaKey) {
      e.preventDefault(); dbgCopy();
    }
  });
  document.addEventListener('mousemove', function (e) {
    if (!dbg) return;
    if (dbgPin) return;                       // 已锁定：鼠标移动不再改面板
    var el = e.target;
    if (el === dbgLast) return;
    if (dbgLast) dbgLast.classList.remove('dbgout');
    if (el && el.nodeType === 1 && !(el.closest && el.closest('#dbgbox'))) {
      el.classList.add('dbgout'); dbgLast = el;
    }
    dbgRender(el);
  }, true);
  /* 点击元素＝锁定并自动复制，且不触发系统本身功能 */
  document.addEventListener('click', function (e) {
    if (!dbg) return;
    if (e.target && e.target.closest && e.target.closest('#dbgbox')) return;  // 面板自身照常
    e.preventDefault(); e.stopPropagation();
    dbgLock(e.target);
    dbgCopy(true);
    toast('已锁定并复制该元素（Esc 解锁，未执行该元素功能）', 'ok');
  }, true);

  /* ── 导出（供自动化验证与调试）────────────────────────────── */
  window.APP = {
    setRole: function (k) { setRole(k); },
    setRoleSoft: function (k) { setRoleSoft(k); },
    roleFor: function (sc) { return roleFor(sc); },
    roleCurrent: function () { return roleCurrent(); },
    S: S, go: go, render: render, SYSTEMS: SYSTEMS, VERSION: VERSION, LIFECYCLE: LIFECYCLE,
    addCatalog: addCatalog, newCatalogCode: newCatalogCode,
    today: today, now: now, fsDays: fsDays, plusMs: plusMs, xlsxSheets: xlsxSheets, idxOf: idxOf,
    pendingCatalogs: pendingCatalogs, publishedCatalogs: publishedCatalogs,
    META: META, SCREENS: (window.SCREENS = window.SCREENS || {}),
    openDrawer: openDrawer, closeDrawer: closeDrawer,
    openModal: openModal, closeModal: closeModal, toast: toast,
    toggleDebug: toggleDebug, isDebug: function () { return dbg; },
    toggleDebug: toggleDebug, debug: function () { return dbg; },
    esc: esc, tag: tag, statusTag: statusTag, now: now, today: today, num: num,
    ROLES: ROLES, LIFECYCLE: LIFECYCLE,
    get screen() { return S.screen; },
    get sys() { return S.sys; }
  };
  window.__proto = window.APP;   // 兼容 skill 约定的测试接口名

  /* ── 启动 ─────────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function () {
    if (!document.getElementById('root')) {
      var d = document.createElement('div'); d.id = 'root'; document.body.appendChild(d);
    }
    render();
  });
})();

  /* ── 只读字段 ── */

  function ctlText(id, val, ph, ro) {

  function ctlArea(id, val, ph) {

           'style="min-height:52px">' + A().esc(val) + '</textarea></div>';
  }
  function ctlSelect(id, val, opts, ph) {
    var o = '<option value="">' + A().esc(ph || '请选择') + '</option>';
    opts.forEach(function (v) {
      o += '<option value="' + A().esc(v) + '"' + (v === val ? ' selected' : '') + '>' + A().esc(v) + '</option>';
    });
    return '<div class="ctl"><select id="' + id + '">' + o + '</select></div>';
  }
  function ctlChips(id, vals, opts) {
    var cur = String(vals || '').split(/[，,]/).map(function (s) { return s.trim(); }).filter(Boolean);
    var h = '<div class="ctl" style="flex-wrap:wrap;gap:5px" data-chips="' + id + '">' +
      // 真值存在 hidden input（id 与字段一致，供 collect/validate 读取）
      '<input type="hidden" id="' + id + '" value="' + A().esc(cur.join('，')) + '">';
    cur.forEach(function (c) {
      h += '<span class="chip" data-v="' + A().esc(c) + '">' + A().esc(c) +
           '<x class="chip-x" title="移除">✕</x></span>';
    });
    h += '<select class="chip-add" id="' + id + '-add" style="width:auto;min-width:88px">' +
         '<option value="">＋ 添加</option>';
    opts.forEach(function (v) {
      h += '<option value="' + A().esc(v) + '"' + (cur.indexOf(v) >= 0 ? ' disabled' : '') + '>' +
           A().esc(v) + (cur.indexOf(v) >= 0 ? '（已选）' : '') + '</option>';
    });
    return h + '</select></div>';
  }

  /* chip 多选的读写与同步 */
  function syncChips(id) {
    var wrap = document.querySelector('[data-chips="' + id + '"]'); if (!wrap) return;
    var vals = Array.prototype.map.call(wrap.querySelectorAll('.chip'), function (c) {
      return c.getAttribute('data-v'); });
    var hid = document.getElementById(id);
    if (hid) hid.value = vals.join('，');
  }
  function bindChips(id) {
    var wrap = document.querySelector('[data-chips="' + id + '"]'); if (!wrap) return;
    var add = document.getElementById(id + '-add');
    if (add) add.onchange = function () {
      var v = add.value; if (!v) return;
      var span = document.createElement('span');
      span.className = 'chip'; span.setAttribute('data-v', v);
      span.innerHTML = A().esc(v) + '<x class="chip-x" title="移除">✕</x>';
      wrap.insertBefore(span, add);
      Array.prototype.forEach.call(add.options, function (o) {
        if (o.value === v) { o.disabled = true; o.textContent = v + '（已选）'; } });
      add.value = '';
      span.querySelector('.chip-x').onclick = function () { removeChip(wrap, span, add, v); };
      syncChips(id);
      if (id === 'f6') A().toast('已添加：' + v);
    };
    wrap.querySelectorAll('.chip-x').forEach(function (x) {
      x.onclick = function () {
        var span = x.parentNode;
        removeChip(wrap, span, add, span.getAttribute('data-v'));
        syncChips(id);
      };
    });
    syncChips(id);
  }
  function removeChip(wrap, span, add, v) {
    span.remove();
    if (add) Array.prototype.forEach.call(add.options, function (o) {
      if (o.value === v) { o.disabled = false; o.textContent = v; } });
  }

  /* 单个字段容器 */
  function field(f, ctrlHtml, extra) {
    var req = f.required === 'req' ? '<span class="req">*</span>' :
              (f.required === 'cond' ? '<span class="req" title="条件必填">◐</span>' : '');
    var hint = f.hint ? '<i class="hint" title="' + A().esc(f.hint) + '">?</i>' : '';
    var cond = f.cond ? '<span class="tl">条件：' + A().esc(f.cond) + '</span>' : '';
    return '<div class="fi" id="fi-' + f.idx + '" data-field="' + f.idx + '">' +
      '<label>' + req + A().esc(f.label) + hint + '</label>' + ctrlHtml + cond +
      '<span class="msg">此项为必填，请填写</span></div>';
  }

  /* ── 分组面板 ── */
  function groupPanel(g, gi, extraHtml, nOverride) {
    if (g.isTable) return itemGroup(g, gi);
    // 按字段性质排栅格：摘要/原因类占 2 列
    var wide = { 2: 1, 11: 1, 14: 1, 15: 1, 21: 1, 25: 1, 35: 1 };
    var body = '<div class="fgrid">';
    if (extraHtml) body += extraHtml;          // 只读字段等，作为栅格内第一项
    g.fields.forEach(function (f) {
      var cls = wide[f.idx] ? 'fi span2' : 'fi';
      var html;
      if (f.idx === 6) html = ctlChips('f' + f.idx, DEF[f.idx], f.values);
      else if (f.values && f.values.length) html = ctlSelect('f' + f.idx, DEF[f.idx], f.values);
      else if (f.idx === 17 || f.idx === 18) html = ctlText('f' + f.idx, DEF[f.idx], '如 2025-06-30');
      else if (wide[f.idx]) html = ctlArea('f' + f.idx, DEF[f.idx]);
      else html = ctlText('f' + f.idx, DEF[f.idx]);
      body += field(f, html).replace('class="fi"', 'class="' + cls + '"');
    });
    body += '</div>';
    return panelWrap(g, gi, body, nOverride || g.fields.length);
  }

  function panelWrap(g, gi, body, n) {
    return '<div class="panel" id="gp-' + gi + '" data-group="' + g.name + '">' +
      '<div class="ph"><span class="n">' + (gi + 1) + '</span><h3>' + A().esc(g.name) + '</h3>' +
      '<span class="meta">' + n + ' 项</span><span class="caret">▼</span></div>' +
      '<div class="pb">' + body + '</div></div>';
  }

  /* ── 数据项表格（19 项字段：表格显示主列，编辑开抽屉看全）── */
  function itemGroup(g, gi) {
    var its = items();
    var rows = its.map(function (it) {
      return '<tr data-item="' + it.no + '">' +
        '<td class="c">' + it.no + '</td>' +

    var body =

      its.filter(function (x) { return x.pk === '是'; }).length +
      '</b> 个。<b>治理规则需挂载在字段上，故数据项不少于 3 项</b>（本次 ' + its.length +
      ' 项，满足要求）。点击「编辑」可查看与修改全部 19 项属性。</div></div>' +
      '<div class="tblwrap" style="max-height:none"><table class="data" id="tbl-items">' +
      '<thead><tr><th class="c" style="width:44px">序号</th><th>数据项名称</th><th>英文名称</th>' +
      '<th>数据类型</th><th class="n">长度</th><th class="c">主键</th><th class="c">可为空</th>' +
      '<th>敏感级别</th><th>共享属性</th><th style="width:110px">操作</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +

      '<span class="btn" id="btn-add-item">＋ 新增数据项</span>' +
      '<span class="mut sm">一个数据目录必须且仅有一个主键；主键的「是否可为空」必须为“否”</span></div>';
    return panelWrap(g, gi, body, its.length);

  /* 统一的「该组有多少项内容」计数
     普通组 = 字段数；数据项组 = 实际数据项条数（不是它的 19 个属性列） */
  function groupCount(g) { return g.isTable ? items().length : g.fields.length; }

  /* 来源系统 → 所属分类（联动规则1：选定来源系统后自动带出；分类值域：自建自用/国直/省直/市级自建） */
  var SECLASS = {

    '四川省社会保障卡管理系统': '国直',

    '四川省税务大数据平台': '国直',
    '数据管理系统': '省直'
  };
  /* 数据提供单位 → 可选来源系统（联动规则2：单位决定可选系统范围，通用系统对所有单位开放） */
  var SYSBYORG = {
    '四川省公安厅': ['四川省人口基础信息库', '数据管理系统'],
    '四川省民政厅': ['四川省社会救助信息管理系统', '四川省养老服务信息平台', '数据管理系统'],
    '四川省人力资源和社会保障厅': ['金保工程二期社会保险稽核管理系统',
                                  '四川省社会保障卡管理系统', '数据管理系统'],
    '四川省卫生健康委员会': ['四川省卫生健康信息平台', '数据管理系统'],
    '四川省教育厅': ['四川省学籍管理系统', '数据管理系统'],
    '四川省医疗保障局': ['四川省医疗保障信息平台', '数据管理系统'],
    '四川省市场监督管理局': ['四川省市场监管一体化平台', '数据管理系统'],
    '四川省税务局': ['四川省税务大数据平台', '数据管理系统']
  };

  /* 按数据提供单位收敛可选来源系统；用户选择变更时把所属分类带出来。
     keepClass=true 用于页面载入：只收敛可选范围，不改写已存数据 */
  function syncSource(keepClass) {
    var orgEl = document.getElementById('f55');
    var sel = document.getElementById('f3');
    if (!sel) { return; }
    var org = orgEl ? orgEl.value : '';
    var list = SYSBYORG[org];
    if (list && sel.getAttribute('data-org') !== org) {
      var cur = sel.value;
      // 用 DOM 构造 option，不拼 HTML 字符串
      while (sel.firstChild) { sel.removeChild(sel.firstChild); }
      list.forEach(function (x) {
        var o = document.createElement('option');
        o.textContent = x;
        if (x === cur) { o.selected = true; }
        sel.appendChild(o);
      });
      var none = document.createElement('option');
      none.textContent = '暂无系统';
      if (cur === '暂无系统') { none.selected = true; }
      sel.appendChild(none);
      sel.setAttribute('data-org', org);
      if (list.indexOf(sel.value) < 0 && sel.value !== '暂无系统') { sel.value = list[0]; }
    }
    // 带出只在「来源系统值真的发生变化」时发生：
    // 载入时(keepClass)不动；仅重选数据提供单位而系统未变时也不动
    var last = sel.getAttribute('data-sys') || '';
    if (!keepClass && sel.value !== last) {
      var cls = SECLASS[sel.value];
      var c = document.getElementById('f4');
      if (c && cls) { c.value = cls; }
    }
    sel.setAttribute('data-sys', sel.value);
    applyCond();
  }

  /* 按当前选择刷新条件字段显隐（11 条联动规则） */
  function applyCond() {
    var v = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
    var show = function (idx, on) {
      var el = document.getElementById('fi-' + idx); if (!el) return;
      el.style.display = on ? '' : 'none';
    };
    show(4, v('f3') && v('f3') !== '暂无系统');            // 所属分类
    show(8, v('f7') && v('f7') !== '暂无数据');            // 格式类型
    show(14, v('f13') === '否');                           // 不允许回流原因
    show(15, v('f13') === '是');                           // 回流切分字段
    show(20, v('f19') !== '不予共享');                     // 共享方式
    show(22, v('f19') !== '不予共享');                     // 共享频率
    show(23, v('f22') === '其他');                         // 共享频率说明
    show(35, true);   // 不予发布原因：常显（选「否」时必填）——便于评审直接看到该要素
    // 聚合约束提示
    var n = document.getElementById('agg-tip');
    if (n) n.style.display = (v('f19') === '无条件共享') ? '' : 'none';
  }

  function collect() {
    var out = {};
    (window.FORM_SPEC || []).forEach(function (g) {
      g.fields.forEach(function (f) {
        var e = document.getElementById('f' + f.idx);
        if (e) out[f.idx] = e.value;
      });
    });
    return out;
  }

  /* 校验：必填 + 主键规则 + 聚合约束 */
  function validate() {
    var errs = [], vals = collect();
    (window.FORM_SPEC || []).forEach(function (g) {
      if (g.isTable) return;
      g.fields.forEach(function (f) {
        var fi = document.getElementById('fi-' + f.idx);
        if (!fi || fi.style.display === 'none') return;
        // 条件必填：常显字段的必填与否仍按条件判定（不能靠「隐藏即跳过」）
        //   23 共享频率说明 —— 仅当共享频率=其他
        //   35 不予发布原因 —— 仅当是否发布=否
        var need = f.required === 'req' ||
          (f.required === 'cond'
            && !(f.idx === 23 && vals[22] !== '其他')
            && !(f.idx === 35 && vals[34] !== '否'));
        if (need && !String(vals[f.idx] || '').trim()) {
          errs.push({ idx: f.idx, label: f.label, why: '必填项未填写' });
        }
      });
    });
    // 数据项规则
    var its = items();
    if (its.length < 3) errs.push({ idx: 36, label: '数据项', why: '少于 3 项，无法配置治理规则' });
    var pks = its.filter(function (x) { return x.pk === '是'; });
    if (pks.length === 0) errs.push({ idx: 43, label: '数据项·是否主键', why: '必须指定 1 个主键' });
    // 聚合约束
    if (vals[19] === '无条件共享' && its.some(function (x) {
      return x.share === '有条件共享' || x.share === '不予共享'; })) {
      errs.push({ idx: 19, label: '共享属性',
        why: '任一数据项为「有条件共享/不予共享」时，目录整体不得填「无条件共享」' });
    }
    if (vals[24] === '无条件开放' && its.some(function (x) {
      return x.open === '有条件开放' || x.open === '不予开放'; })) {
      errs.push({ idx: 24, label: '开放属性',
        why: '任一数据项为「有条件开放/不予开放」时，目录整体不得填「无条件开放」' });
    }
    return errs;
  }

  function showErrs(errs) {
    var bar = document.getElementById('errbar'), list = document.getElementById('errlist');
    document.querySelectorAll('.fi.err').forEach(function (e) { e.classList.remove('err'); });
    if (!errs.length) { bar.classList.remove('on'); return; }
    list.innerHTML = errs.map(function (e) {
      return '<li data-err="' + e.idx + '">' + A().esc(e.label) + ' — ' + A().esc(e.why) + '</li>';
    }).join('');
    bar.classList.add('on');
    errs.forEach(function (e) {
      var fi = document.getElementById('fi-' + e.idx); if (fi) fi.classList.add('err');
    });
    list.querySelectorAll('li').forEach(function (li) {
      li.onclick = function () {
        var fi = document.getElementById('fi-' + li.getAttribute('data-err'));
        if (!fi) return;
        fi.scrollIntoView({ block: 'center', behavior: 'smooth' });
        var c = fi.querySelector('input,select,textarea'); if (c) c.focus();
      };
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });

    function parseDelim(text) {

      for (i = 0; i < text.length; i++) {
        ch = text[i];
        if (q) {
          if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else { q = false; } }
          else { cur += ch; }
        } else if (ch === '"') { q = true; }
        else if (ch === ',' || ch === '\t') { row.push(cur); cur = ''; }
        else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
        else if (ch !== '\r') { cur += ch; }
      }
      if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
      return rows.filter(function (r) {

  /* 前置仓录入数据（真实文件读取） */
  function openStage() {
    var fi = document.getElementById('file-data');
    if (fi) fi.click();

  /* ── 对上传数据按真实规则现算五项数字 ──────────────────────────
     口径：total − 去重 = 清洗总量 = 优质 + 问题
     问题四类：过滤（校验码不通过）/ 转换（格式转换）/ 保留原值（与权威源不一致）/ 去重 */
  function computeStats(lines, withProblems) {
    var hdr = (lines[0] || '').replace(/^\uFEFF/, '').split(',').map(function (x) { return x.trim(); });
    var pick = function () {
      for (var a = 0; a < arguments.length; a++) {
        for (var j = 0; j < hdr.length; j++) { if (hdr[j].indexOf(arguments[a]) >= 0) { return j; } }
      }
      return -1;
    };
    var iUid = pick('唯一标识'), iId = pick('身份证'), iName = pick('姓名'), iBatch = pick('批次号'),
        iBirth = pick('出生日期'), iSex = pick('性别');
    if (iUid < 0) { return null; }
    var recs = [];
    for (var i = 1; i < lines.length; i++) {
      if (lines[i].trim()) { recs.push(lines[i].split(',')); }
    }
    if (!recs.length) { return null; }

    // 一数一源：按主关联字段（身份证件号码）把权威数据源建成索引，用于逐行比对验证字段
    var authById = {};
    (window.DATA && window.DATA.auth || []).forEach(function (row) {
      if (iId >= 0 && row[iId]) { authById[row[iId]] = row; }
    });
    // 验证字段可多选：取治理规则配置，缺省回落到「姓名」
    var RS = (window.DATA && window.DATA.ruleSource) || {};
    var VF = (RS.verify_field_list && RS.verify_field_list.length)
      ? RS.verify_field_list : [RS.verify_field || '姓名'];
    var vIdx = {};
    VF.forEach(function (lb) { var j = pick(lb); if (j >= 0) { vIdx[lb] = j; } });
    var relField = function (c, ar) {   // 返回首个不一致的验证字段
      for (var q = 0; q < VF.length; q++) {
        var j = vIdx[VF[q]]; if (j == null) { continue; }
        var bv = c[j] == null ? '' : String(c[j]);
        var av = ar[j] == null ? '' : String(ar[j]);
        if (bv !== av) { return { field: VF[q], v: bv, a: av }; }
      }
      return null;
    };
    var idOk = function (s) {           // GB 11643 校验码
      if (!s || !/^\d{17}[\dXx]$/.test(s)) { return false; }
      var w = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2], c = '10X98765432', sum = 0;
      for (var k = 0; k < 17; k++) { sum += (parseInt(s.charAt(k), 10) || 0) * w[k]; }
      return c.charAt(sum % 11) === s.charAt(17).toUpperCase();
    };

    // ① 去重（按自然人唯一标识，保留首条）
    var seenU = {}, dupRemoved = 0, kept = [];
    recs.forEach(function (c) {
      var u = c[iUid] || '';
      if (seenU[u]) { dupRemoved++; return; }
      seenU[u] = 1; kept.push(c);
    });

    // ② 逐行按真实规则判定
    var pFilter = 0, pConvert = 0, pKeep = 0, pDup = 0, seenId = {};
    var kids = [];
    var prob = withProblems ? [] : null;
    kept.forEach(function (c) {
      var uid = c[iUid] || '';
      var idv = iId >= 0 ? (c[iId] || '') : '';
      var nm = iName >= 0 ? (c[iName] || '') : '';
      var birth = iBirth >= 0 ? (c[iBirth] || '') : '';
      var sex = iSex >= 0 ? (c[iSex] || '') : '';
      var type = '', field = '', rule = '', act = '', o = '', a = '';
      if (iName >= 0 && !nm) {
        type = '过滤'; field = '姓名'; rule = '一数一标准·姓名必填校验';
        act = '姓名字段为空，标记过滤待整改（未写入清洗仓有效集）'; o = '（空值）';
      } else if (iBirth >= 0 && !birth) {
        type = '过滤'; field = '出生日期'; rule = '一数一标准·出生日期必填校验';
        act = '出生日期字段为空，标记过滤待整改（未写入清洗仓有效集）'; o = '（空值）';
      } else if (iBatch >= 0 && !(c[iBatch] || '')) {
        type = '过滤'; field = '数据批次号'; rule = '一数一标准·数据批次号必填校验';
        act = '数据批次号字段为空，标记过滤待整改（未写入清洗仓有效集）'; o = '（空值）';
      } else if (iId >= 0 && !idOk(idv)) {
        type = '过滤'; field = '身份证件号码'; rule = '一数一标准·身份证件号码 GB 11643 校验';
        act = '校验码不通过，标记过滤待整改（未写入清洗仓有效集）'; o = idv;
      } else if (iBirth >= 0 && birth && !/^\d{4}-\d{2}-\d{2}$/.test(birth)) {
        type = '转换'; field = '出生日期'; rule = '一数一标准·出生日期格式 YYYY-MM-DD';
        act = '按标准规则转换为规范值后写入清洗仓'; o = birth;
      } else if (iSex >= 0 && sex && ['男', '女', '未知'].indexOf(sex) < 0) {
        type = '转换'; field = '性别'; rule = '一数一标准·性别值域 {男,女,未知}';
        act = '按标准规则转换为规范值后写入清洗仓'; o = sex;
      } else if (iId >= 0 && idv && authById[idv] && relField(c, authById[idv])) {
        var hh = relField(c, authById[idv]);
        type = (RS.strategy === '转换为权威数据') ? '转换' : '保留原值';
        field = hh.field; o = hh.v; a = hh.a;
        rule = '一数一源·主关联字段=身份证件号码，验证字段=' + hh.field;
        act = (type === '保留原值') ? '保留原值（记入问题清单待业务确认）'
                                    : '按权威数据源转换为权威值后写入清洗仓';
      } else if (iId >= 0 && idv && seenId[idv]) {
        type = '去重'; field = '自然人唯一标识';
        rule = '一数一标准·自然人唯一标识唯一性校验';
        act = '重复记录，仅保留首条'; o = uid;
      } else if (iId >= 0 && idv) { seenId[idv] = 1; }

      if (type === '过滤') { pFilter++; }
      else if (type === '转换') { pConvert++; }
      else if (type === '保留原值') { pKeep++; }
      else if (type === '去重') { pDup++; }
      if (prob && type) {
        prob.push({ n: prob.length + 1, t: type, f: field, rid: uid, key: uid,
                    o: o, a: a, act: act, rule: rule });
      }
    });
    var problem = pFilter + pConvert + pKeep + pDup;
    var after = kept.length;
    var stats = {
      total: recs.length, dup_removed: dupRemoved, after_dedup: after, cleaned: after,
      good: after - problem, problem: problem,
      by_type: { '过滤': pFilter, '转换': pConvert, '保留原值': pKeep, '去重': pDup }
    };
    return withProblems ? { stats: stats, problems: prob } : stats;
  }

  function bindUpload() {
    var fi = document.getElementById('file-data'); if (!fi) return;
    fi.onchange = function () {
      var f = fi.files && fi.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var txt = String(r.result || '');
        var lines = txt.split(/\r?\n/).filter(function (x) { return x.trim(); });
        var n = Math.max(0, lines.length - 1);
        var cols = lines[0] ? lines[0].split(',').length : 0;
        C().staged = true;
        C().rows = n;
        // 按真实规则现算五项数字（口径：total − 去重 = 清洗总量 = 优质 + 问题）
        // 内置数据集沿用预置统计（已逐项验证）；导入其他数据集时按真实规则现算，
        // 并把问题明细一并重建，保证「五项数字」与「问题清单」口径完全一致。
        var builtin = !!(window.DATA && window.DATA.stats && window.DATA.stats.total === n);
        if (!builtin) {
          var pr = computeStats(lines, true);
          if (pr) {
            window.DATA = window.DATA || {};
            window.DATA.stats = pr.stats;
            window.DATA.problems = pr.problems;
            C().stats = pr.stats;
          }
        }
        A().render();        // 先重绘（前置仓数据量/按钮变化），再开弹窗
        A().openModal('待归集数据导入结果',
          '<div class="notice ok"><span class="ic">✓</span><div>文件 <b>' + A().esc(f.name) +
          '</b>（' + (f.size / 1024).toFixed(1) + ' KB）已写入前置仓表 <b class="mono">' +

          '<div class="kv" style="margin-top:12px">' +
          '<div class="r"><div class="k">导入行数</div><div class="v"><b>' + n + ' 行</b></div></div>' +
          '<div class="r"><div class="k">字段数</div><div class="v">' + cols + ' 个</div></div>' +
          '<div class="r"><div class="k">表头</div><div class="v mono">' +
            A().esc((lines[0] || '').slice(0, 150)) + '</div></div>' +
          '<div class="r"><div class="k">数据样例</div><div class="v mono">' +
            A().esc((lines[1] || '').slice(0, 150)) + '</div></div>' +
          '</div>' +
          '<div class="notice" style="margin-top:10px"><span class="ic">i</span><div>' +
          '「在前置仓里录入待归集数据」→ 再执行归集任务。' +
          '该数据集<b>刻意包含重复、格式错误、与权威源不一致的问题数据</b>，供后续治理环节使用。</div></div>',
          '<span class="btn" data-close-m="1">继续</span>');
      };
      r.readAsText(f, 'utf-8');
    };
  }

  function submitRule() {
    var g = G();

    var auth = (document.getElementById('g-auth') || {}).value || '';
    var main = (document.getElementById('g-main') || {}).value || '';
    var ver = [].slice.call(document.querySelectorAll('input[name="g-verify-cb"]:checked'))
      .map(function (e) { return e.value; }).join('、') || '—';
    g.rules = DEF_RULES.slice();
    g.source = { relate: true, authority: auth, table: 'authority_natural_person',
                 main: main, verify: ver, strategy: strat };
    g.ruleStatus = '审核中';
    g.ruleSubmitAt = A().now();
    A().S.done.gconf = true;
    A().render();            // 先重绘再开弹窗
    A().openModal('治理规则配置已提交',

    for (var i = 0; i < rows.length; i++) {
      if (p.t === '过滤') { if (rows[i][iId] === p.o) { row = rows[i]; break; } }

      '<div class="r full"><div class="k">命中规则</div><div class="v">' + A().esc(p.rule) + '</div></div>' +
      '<div class="r full"><div class="k">处置方式</div><div class="v">' + A().esc(p.act) + '</div></div>' +
      (p.t === '保留原值' && isConv()

          A().esc(String(p.o)) + '</div></div>'

  /* 导出问题清单（真实下载 CSV） */
  function exportCsv() {
    var ps = flt === '全部' ? probs() : probs(flt);
    var head = ['序号', '问题类型', '问题字段', '业务主键',
                isConv() ? '原始值（留存）' : '原始值',
                isConv() ? '权威源值（已生效）' : '权威源值', '处置方式', '命中规则'];
    var lines = [head.join(',')].concat(ps.map(function (p) {
      return [p.n, typeLabel(p.t), p.f, p.key, p.o, p.a, p.act, p.rule].map(function (v) {
        var s = String(v == null ? '' : v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }));
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '数据治理问题清单_' + (flt === '全部' ? '全部' : typeLabel(flt)) + '_' + A().today() + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    A().toast('已导出 ' + ps.length + ' 条问题数据', 'ok');
  }
